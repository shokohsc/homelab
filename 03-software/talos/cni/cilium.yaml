# Cilium 1.18.0 - Compatible with KubeSpan
# Do NOT enable bpf.masquerade with KubeSpan
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  chart: cilium
  repo: https://helm.cilium.io
  version: 1.18.0
  targetNamespace: kube-system
  valuesContent: |-
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    
    gatewayAPI:
      enabled: true
      externalTrafficPolicy: Local
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    l2announcements:
      enabled: true
    loadBalancer:
      mode: dsr
      l7:
        backend: envoy
    routingMode: native
    # https://github.com/OneUptime/blog/blob/master/posts/2026-03-03-tune-network-performance-on-talos-linux/README.md#cni-specific-optimizations
    enableIPv4Masquerade: true
    bpf:
      hostRouting: true
      tproxy: true
      lbExternalClusterIP: true
    bandwidthManager:
      enabled: true
      bbr: true