# Systemd journal configuration for volatile storage
# This keeps logs in RAM, reducing SD card writes

# Where to store journals. volatile = runtime only (RAM)
Storage={{ journald_storage | default('volatile') }}

# Maximum runtime journals can use before oldest are discarded
RuntimeMaxUse={{ journald_max_use | default('50M') }}

# Keep only recent logs when storage limit is reached
SystemMaxUse={{ journald_max_use | default('50M') }}

# How long to keep logs before discarding
SystemKeepFree={{ journald_max_use | default('50M') }}

# Where to store boot logs
SystemLogTarget=auto

# Write journal to syslog
ForwardToSyslog=yes

# Disable rate limiting to prevent container stdout blocking
RateLimitIntervalSec=0
RateLimitBurst=0

# How to treat permissions of journal files
FileMode=0644
DirectoryMode=0755
