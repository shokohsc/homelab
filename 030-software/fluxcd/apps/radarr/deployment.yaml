apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  annotations:
    secret.reloader.stakater.com/reload: radarr
    configmap.reloader.stakater.com/reload: config
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: radarr
          image: ghcr.io/home-operations/radarr:6.4.4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: ${timezone}
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: radarr
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  key: database-user
                  name: radarr
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: radarr
          envFrom:
            - configMapRef:
                name: config
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            limits:
              memory: 2048Mi
            requests:
              cpu: 100m
          volumeMounts:
            - name: tmp
              mountPath: /config
            - name: movies
              mountPath: /mnt/movies
            - name: downloads
              mountPath: /mnt/downloads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: movies
          nfs:
            server: genji.home.arpa
            path: /movies
        - name: downloads
          nfs:
            server: 10.102.22.211
            path: /
