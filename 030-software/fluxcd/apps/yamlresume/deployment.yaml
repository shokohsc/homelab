---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamlresume
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: yamlresume
  template:
    metadata:
      labels:
        app: yamlresume
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: yamlresume
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: yamlresume
      containers:
        - name: yamlresume
          image: yamlresume/yamlresume:v0.17.0
          command: ["node", "/app/server.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: work
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: yamlresume
        - name: work
          emptyDir: {}
