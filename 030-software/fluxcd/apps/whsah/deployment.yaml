---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: whsah-server
  labels:
    nfs-hanzo: "true"
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: whsah-server
  template:
    metadata:
      labels:
        app: whsah-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: whsah-server
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: whsah-server
      containers:
        - name: whsah-server
          image: ghcr.io/shokohsc/whsah-server:sha-a740dc0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: VDI_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: whsah
                  key: postgresql-url
            - name: VDI_PROXMOX_BASE
              value: "https://proxmox.${domain}"
            - name: VDI_PROXMOX_NODE
              value: ""
            # - name: VDI_PROXMOX_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: whsah-credentials
            #       key: proxmox-token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              port: http
              path: /health
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: hanzo
              mountPath: /mnt/games
            - mountPath: /etc/ssl/certs
              name: tls
      volumes:
        - name: hanzo
          nfs:
            server: hanzo.${domain}
            path: /
        - name: tls
          configMap:
            name: homelab-ca-cm
            defaultMode: 0600
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: whsah-web
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: whsah-web
  template:
    metadata:
      labels:
        app: whsah-web
        policy.gatekeeper.sh/ignore-psp-volume-types: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: whsah-web
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: whsah-web
      containers:
        - name: whsah-web
          image: busybox:1.38
          args: ["busybox", "httpd", "-f", "-v", "-p", "8080"]
          workingDir: /assets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              port: http
              path: /
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: assets
              mountPath: /assets
      volumes:
        - name: assets
          image:
            reference: ghcr.io/shokohsc/whsah-web:sha-a740dc0