---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: whsah
  annotations:
    cert-manager.io/cluster-issuer: ca-cluster-issuer
spec:
  parentRef:
    namespace: cilium
    name: cilium
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
  - name: whsah
    hostname: whsah.${domain}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: whsah-cert
  - name: api
    hostname: api.whsah.${domain}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: api-whsah-cert