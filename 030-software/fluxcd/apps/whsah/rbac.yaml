apiVersion: v1
kind: ServiceAccount
metadata:
  name: whsah
  labels:
    app: whsah
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: whsah
  labels:
    app: whsah
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: whsah
  labels:
    app: whsah
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: whsah
subjects:
  - kind: ServiceAccount
    name: whsah
    namespace: whsah
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: whsah-leaderelection
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: whsah-leaderelection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: whsah-leaderelection
subjects:
  - kind: ServiceAccount
    name: whsah
    namespace: whsah