apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spacebar
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - pvc.yaml
  - secret.yaml
configMapGenerator:
- name: config
  env: ./config/config.json
generatorOptions:
  disableNameSuffixHash: true