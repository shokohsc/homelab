apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaultwarden
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - pvc.yaml
  - secret.yaml
  # - cronjob.yaml
configMapGenerator:
- name: scripts
  files:
  - ./scripts/vaultwarden_export.sh
generatorOptions:
  disableNameSuffixHash: true
