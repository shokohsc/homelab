apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/instance: lidarr
    app.kubernetes.io/name: lidarr
  annotations:
    cert-manager.io/cluster-issuer: ca-cluster-issuer
    dashboard.${domain}/icon: music-note
    dashboard.${domain}/name: lidarr
    dashboard.${domain}/url: https://lidarr.${domain}
    kubernetes.io/ingress.class: ${ingressClass}

    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "0"
spec:
  tls:
    - hosts:
        - "lidarr.${domain}"
      secretName: "lidarr-cert"
  rules:
    - host: "lidarr.${domain}"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  number: 80
