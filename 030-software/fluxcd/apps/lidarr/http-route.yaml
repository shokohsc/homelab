---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  annotations:
    dashboard.${domain}/icon: music-note
    dashboard.${domain}/name: lidarr
    dashboard.${domain}/url: https://lidarr.${domain}
spec:
  hostnames:
  - lidarr.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: lidarr
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
