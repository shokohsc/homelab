apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lidarr
resources:
  - namespace.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - service.yaml
  - http-route.yaml
  - secret.yaml
configMapGenerator:
- name: config
  env: ./config/lidarr.env
generatorOptions:
  disableNameSuffixHash: true