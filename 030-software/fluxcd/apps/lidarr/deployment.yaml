apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  annotations:
    secret.reloader.stakater.com/reload: lidarr
    configmap.reloader.stakater.com/reload: config
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
        policy.gatekeeper.sh/ignore-container-must-have-limits: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: lidarr
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lidarr
      containers:
        - name: lidarr
          image: ghcr.io/home-operations/lidarr:3.1.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: ${timezone}
            - name: LIDARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: lidarr
            - name: LIDARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  key: database-user
                  name: lidarr
            - name: LIDARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: lidarr
          envFrom:
            - configMapRef:
                name: config
          ports:
            - name: http
              containerPort: 8686
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
          volumeMounts:
            - name: tmp
              mountPath: /config
            - name: music
              mountPath: /mnt/music
            - name: downloads
              mountPath: /mnt/downloads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: music
          nfs:
            server: genji.${domain}
            path: /lidarr
        - name: downloads
          nfs:
            server: ${nfsDownloadsServer}
            path: /lidarr
