---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rustfs
spec:
  interval: ${interval}
  url: https://charts.rustfs.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
spec:
  interval: ${interval}
  chart:
    spec:
      chart: rustfs
      version: 1.0.1
      sourceRef:
        kind: HelmRepository
        name: rustfs
      interval: ${interval}
  valuesFrom:
    - kind: Secret
      name: credentials
      valuesKey: access_key
      targetPath: secret.rustfs.access_key
    - kind: Secret
      name: credentials
      valuesKey: secret_key
      targetPath: secret.rustfs.secret_key
  values:
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    
    replicaCount: 2

    drivesPerNode: 1

    config:
      rustfs:
        obs_log_directory: ""

    storageclass:
      name: ceph-rbd
      dataStorageSize: 1Gi
      logStorageSize: 1Gi

    ingress:
      enabled: false
    
    gatewayApi:
      enabled: false

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
    
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    
    affinity:
      podAntiAffinity:
        enabled: true
    
    podLabels:
      policy.gatekeeper.sh/ignore-container-must-have-limits: "true"