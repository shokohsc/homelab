---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rustfs
spec:
  interval: ${interval}
  url: https://charts.rustfs.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
spec:
  interval: ${interval}
  chart:
    spec:
      chart: rustfs
      version: 1.0.0-rc.4
      sourceRef:
        kind: HelmRepository
        name: rustfs
      interval: ${interval}
  valuesFrom:
    - kind: Secret
      name: credentials
      valuesKey: access_key
      targetPath: secret.rustfs.access_key
    - kind: Secret
      name: credentials
      valuesKey: secret_key
      targetPath: secret.rustfs.secret_key
  values:
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    
    replicaCount: 2

    drivesPerNode: 1

    storageclass:
      name: ceph-rbd
      dataStorageSize: 1Gi
      logStorageSize: 1Gi

    ingress:
      enabled: false
    
    gatewayApi:
      enabled: true
      httpToHttpsRedirect: false
      gatewayClass: cilium
      hostname: rustfs.${domain}
      listeners:
        https:
          name: https
      existingGateway:
        name: cilium
        namespace: cilium

    podLabels:
      policy.gatekeeper.sh/ignore-container-must-have-limits: "true"
    
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
