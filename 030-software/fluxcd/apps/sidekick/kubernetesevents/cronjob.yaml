---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: truncate-events
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: postgres
              image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
              command:
                - psql
              args:
                - --command
                - 'DELETE FROM events WHERE "createdAt" < now() - INTERVAL ''1 days'''
              env:
                - name: PGDATABASE
                  value: sidekick
                - name: PGHOST
                  value: postgresql.postgresql
                - name: PGUSER
                  value: sidekick
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sidekick
                      key: postgresql-database-password
              resources:
                requests:
                  cpu: 100m
                limits:
                  memory: 64Mi
