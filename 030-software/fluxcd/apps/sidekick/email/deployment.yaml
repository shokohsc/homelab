---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: email
  annotations:
    configmap.reloader.stakater.com/reload: common-env,config
spec:
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3030"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: email
          image: shokohsc/moleculer-sidekick@sha256:23483958fe0a405db03b8629df3a822602142ae174511d66cc11711cd2cb6f8b
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          command: ["npm"]
          args: ["run", "start"]
          envFrom:
            - configMapRef:
                name: common-env
          env:
            - name: SERVICES
              value: email
            - name: EMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: email
                  key: username
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email
                  key: password
            - name: IMAP_HOST
              value: imap.maddy
            - name: IMAP_PORT
              value: "993"
            - name: SMTP_HOST
              value: smtp.maddy
            - name: SMTP_PORT
              value: "465"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          ports:
            - name: metrics
              containerPort: 3030
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          readinessProbe:
            httpGet:
              port: metrics
              path: /metrics
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 256Mi
