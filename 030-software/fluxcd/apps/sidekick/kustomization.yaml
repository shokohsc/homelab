apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sidekick
resources:
  - namespace.yaml

  - api/
  - vpn/
  # - kubernetesevents/
  # - cmangos/
  # - email/

images:
  - name: shokohsc/moleculer-sidekick
    newTag: "a628e77"

configMapGenerator:
  - name: common-env
    envs:
      - ./config/common-env
  - name: config
    files:
      - ./config/nats.conf
generatorOptions:
  disableNameSuffixHash: true
