---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  labels:
    app.kubernetes.io/name: browserless
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 12h"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: browserless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browserless
    spec:
      automountServiceAccountToken: false
      containers:
        - name: browserless
          image: ghcr.io/browserless/chromium:v2.46.0
          env:
            - name: TOKEN
              value: EeJ4Ou3waagh7goMohsah6sooTeehoom
            - name: CONCURRENT
              value: "6"
            - name: TIMEOUT
              value: "15000"
            - name: HEALTH
              value: "true"
            - name: MAX_MEMORY_PERCENT
              value: "80"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /docs
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128M
            limits:
              cpu: 3
              memory: 4096M
