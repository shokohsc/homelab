---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browserless
spec:
  hostnames:
    - browserless.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: browserless
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
