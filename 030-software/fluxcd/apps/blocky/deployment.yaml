---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  labels:
    app.kubernetes.io/name: blocky
  annotations:
    configmap.reloader.stakater.com/reload: config
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
    spec:
      dnsConfig:
        nameservers:
        - 1.1.1.1
      containers:
        - name: blocky
          image: spx01/blocky:v0.26
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: TZ
              value: ${timezone}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
            - name: doh
              containerPort: 443
              protocol: TCP
            - name: dot-udp
              containerPort: 853
              protocol: UDP
            - name: dot-tcp
              containerPort: 853
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
          startupProbe:
            failureThreshold: 30
            periodSeconds: 10
            tcpSocket:
              port: 53
          livenessProbe:
            tcpSocket:
              port: 53
          readinessProbe:
            tcpSocket:
              port: 53
          resources:
            requests:
              cpu: 10m
              memory: 128M
            limits:
              cpu: 2000m
              memory: 2048M
      volumes:
        - name: config
          configMap:
            name: config
            defaultMode: 0644
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - blocky
              topologyKey: kubernetes.io/hostname
