---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mitmproxy
  annotations:
    dashboard.${domain}/name: mitmproxy
    dashboard.${domain}/url: https://mitmproxy.${domain}
    dashboard.${domain}/icon: access-point-network
spec:
  hostnames:
  - mitmproxy.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: mitmproxy
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /