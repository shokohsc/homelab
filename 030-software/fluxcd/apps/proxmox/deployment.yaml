apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  annotations:
    configmap.reloader.stakater.com/reload: config
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.11.4-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          # command:
          #   - caddy
          # args:
          #   - run
          #   - --config
          #   - /srv/Caddyfile
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - mountPath: /etc/ssl/certs
              name: tls
          startupProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
          readinessProbe:
            httpGet:
              path: /
              port: https
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: config
        - name: tls
          configMap:
            name: homelab-ca
            defaultMode: 0600
      tolerations:
        - key: "node.kubernetes.io/nuc"
          operator: "Exists"
          effect: "NoSchedule"
