---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox
spec:
  hostnames:
    - proxmox.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: haproxy
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics
spec:
  hostnames:
    - haproxy.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: haproxy
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /metrics
    - backendRefs:
        - name: haproxy
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
