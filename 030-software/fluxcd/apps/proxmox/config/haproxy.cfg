global
    log stdout format raw local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  10s
    timeout server  10s
    retries 2

frontend http-in
    bind *:80
    mode http
    default_backend proxmox-backend

backend proxmox-backend
    mode http
    balance roundrobin
    option httpchk GET /api2/json/
    http-check expect status 200 401 403
    server roadhog roadhog.${domain}:8006 check inter 5s fall 3 rise 2
    server hanzo hanzo.${domain}:8006 check inter 5s fall 3 rise 2
    server genji genji.${domain}:8006 check inter 5s fall 3 rise 2
