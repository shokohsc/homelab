global
    log stdout format raw local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  10s
    timeout server  10s
    retries 2

frontend stats
    bind *:8080
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats realm HAProxy\ Statistics
    stats refresh 10s

frontend https
    mode tcp
    option tcplog
    bind *:443
    default_backend proxmox-backend

backend proxmox-backend
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect ssl
    default-server inter 5s downinter 5s rise 1 fall 2 slowstart 60s maxconn 250 maxqueue 256 weight 100
    server roadhog roadhog.${domain}:8006 check
    server hanzo hanzo.${domain}:8006 check
    server genji genji.${domain}:8006 check
