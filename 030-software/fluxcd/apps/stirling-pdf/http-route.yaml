---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf
  annotations:
    dashboard.${domain}/name: stirling-pdf
    dashboard.${domain}/url: https://stirling-pdf.${domain}
    dashboard.${domain}/icon: file-pdf-box
spec:
  hostnames:
  - stirling-pdf.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: stirling-pdf
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
