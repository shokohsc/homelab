---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: flux-system
spec:
  url: https://nats-io.github.io/k8s/helm/charts/
  interval: ${interval}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: ${interval}
  chart:
    spec:
      # renovate: registryUrl=https://nats-io.github.io/k8s/helm/charts/
      chart: nats
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  values:
    natsbox:
      enabled: false
    nats:
      limits:
        maxPayload: 32Mb
      resources:
        requests:
          cpu: 10m
          memory: 64M
        limits:
          cpu: 100m
          memory: 64M
    exporter:
      resources:
        requests:
          cpu: 10m
          memory: 64M
        limits:
          cpu: 100m
          memory: 64M
    reloader:
      resources:
        requests:
          cpu: 10m
          memory: 64M
        limits:
          cpu: 100m
          memory: 64M
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"
