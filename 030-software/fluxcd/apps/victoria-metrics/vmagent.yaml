---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmagent
spec:
  interval: ${interval}
  chart:
    spec:
      chart: victoria-metrics-agent
      version: 0.50.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: ${interval}
  values:
    remoteWrite:
      - url: http://victoria-metrics-vms-vminsert.victoria-metrics.svc.cluster.local:8480/insert/0/prometheus
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
