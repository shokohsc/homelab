---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freellmapi
  annotations:
    dashboard.${domain}/icon: robot
    dashboard.${domain}/name: freellmapi
    dashboard.${domain}/url: https://freellmapi.${domain}
spec:
  hostnames:
  - freellmapi.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: freellmapi
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
