apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freellmapi
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - pvc.yaml
  - secret.yaml
configMapGenerator:
- name: config
  files:
  - ./config/variables.env
generatorOptions:
  disableNameSuffixHash: true