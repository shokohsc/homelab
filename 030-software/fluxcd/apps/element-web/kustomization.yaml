apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: element-web
resources:
  - namespace.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - service.yaml
  - http-route.yaml
configMapGenerator:
  - name: config
    files:
      - ./config/config.json
generatorOptions:
  disableNameSuffixHash: true