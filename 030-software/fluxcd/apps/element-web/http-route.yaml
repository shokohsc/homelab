---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-web
  annotations:
    dashboard.${domain}/icon: element
    dashboard.${domain}/name: element
    dashboard.${domain}/url: https://element.${domain}
spec:
  hostnames:
  - element.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: element-web
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /