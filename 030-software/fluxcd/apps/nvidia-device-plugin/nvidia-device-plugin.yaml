---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia-device-plugin
spec:
  interval: ${interval}
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
spec:
  interval: ${interval}
  maxHistory: 1
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.20.2
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
      interval: ${interval}
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: all
              spec:
                template:
                  metadata:
                    labels:
                      policy.gatekeeper.sh/ignore: "true"
            target:
              kind: DaemonSet
              labelSelector: app.kubernetes.io/name=nvidia-device-plugin
  values:
    config:
      default: default
      map:
        default: |-
          version: v1
          sharing:
            timeSlicing:
              renameByDefault: true
              failRequestsGreaterThanOne: false
              replicas: 4
    affinity: null
    runtimeClassName: nvidia
    nodeSelector:
      node.kubernetes.io/gpu: nvidia
    tolerations:
      - key: nvidia
        operator: Exists
        effect: NoSchedule