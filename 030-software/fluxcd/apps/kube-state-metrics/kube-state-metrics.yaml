---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-state-metrics
spec:
  interval: ${interval}
  url: oci://ghcr.io/prometheus-community/charts/kube-state-metrics
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^v7.4.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: ${interval}
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                revisionHistoryLimit: 0
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/instance=kube-state-metrics
  values:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    startupProbe:
      enabled: true
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    podAnnotations:
      descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - mercy
    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"
