apiVersion: platform.${publicDomain}/v1alpha1
kind: ProxmoxIdentity
metadata:
  name: crossplane
spec:
  user: crossplane@pve
  passwordSecretRef:
    namespace: crossplane-system
    name: crossplane-credentials
    key: password
  userGroups:
    - crossplane
  aclPath: /
  tokenName: crossplane
  groupName: crossplane
  roleName: crossplane
  privileges:
    - Datastore.Allocate
    - Datastore.AllocateSpace
    - Pool.Allocate
    - VM.Allocate
    - VM.Clone
    - VM.Config.CDROM
    - VM.Config.CPU
    - VM.Config.Cloudinit
    - VM.Config.Disk
    - VM.Config.Memory
    - VM.Config.Network
    - VM.Config.Options
    - VM.Config.HWType
    - VM.PowerMgmt
    - VM.Console
    - SDN.Use
    - Sys.Audit
    - Sys.Modify
    - Group.Allocate
    - Realm.AllocateUser
  groupRoles:
    - crossplane
