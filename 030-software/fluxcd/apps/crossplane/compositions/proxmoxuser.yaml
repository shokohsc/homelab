apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: proxmoxusers.platform.shokohsc.com
  labels:
    provider: opentofu
spec:
  compositeTypeRef:
    apiVersion: platform.shokohsc.com/v1alpha1
    kind: ProxmoxUser
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: user-workspace
            base:
              apiVersion: opentofu.upbound.io/v1beta1
              kind: Workspace
              spec:
                forProvider:
                  source: Inline
                  module: |
                    variable "user" {
                      type = string
                    }
                    variable "password" {
                      type      = string
                      sensitive = true
                    }
                    variable "groups" {
                      type    = string
                      default = ""
                    }

                    resource "proxmox_virtual_environment_user" "this" {
                      user_id  = var.user
                      password = var.password
                      groups   = var.groups != "" ? split(",", var.groups) : null
                    }

                    output "user_id" {
                      value = proxmox_virtual_environment_user.this.user_id
                    }
                  vars:
                    - key: user
                    - key: groups
                  env:
                    - name: TF_VAR_password
                      secretKeyRef:
                        name: ""
                        namespace: ""
                        key: ""
                writeConnectionSecretToRef:
                  namespace: crossplane-system
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.user
                toFieldPath: spec.forProvider.vars[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.passwordSecretRef.name
                toFieldPath: spec.forProvider.env[0].secretKeyRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.passwordSecretRef.namespace
                toFieldPath: spec.forProvider.env[0].secretKeyRef.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.passwordSecretRef.key
                toFieldPath: spec.forProvider.env[0].secretKeyRef.key
              - type: FromCompositeFieldPath
                fromFieldPath: spec.groups
                toFieldPath: spec.forProvider.vars[1].value
                transforms:
                  - type: string
                    string:
                      type: Join
                      join:
                        separator: ","
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.user_id
                toFieldPath: status.userId
