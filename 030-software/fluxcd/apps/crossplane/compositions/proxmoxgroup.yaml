apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: proxmoxgroups.platform.shokohsc.com
  labels:
    provider: opentofu
spec:
  compositeTypeRef:
    apiVersion: platform.shokohsc.com/v1alpha1
    kind: ProxmoxGroup
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: group-workspace
            base:
              apiVersion: opentofu.upbound.io/v1beta1
              kind: Workspace
              spec:
                forProvider:
                  # enableTofuCLILogging: true
                  source: Inline
                  module: |
                    variable "group" {
                      type = string
                    }
                    variable "roles" {
                      type = string
                    }

                    resource "proxmox_virtual_environment_group" "this" {
                      group_id = var.group
                    }

                    resource "proxmox_acl" "this" {
                      for_each = toset(split(",", var.roles))
                      path     = "/"
                      group_id = proxmox_virtual_environment_group.this.group_id
                      role_id  = each.key
                    }

                    output "group_id" {
                      value = proxmox_virtual_environment_group.this.group_id
                    }
                  vars:
                    - key: group
                    - key: roles
                # providerConfigRef:
                #   name: proxmox
                writeConnectionSecretToRef:
                  namespace: crossplane-system
                  name: opentofu-group-workspace
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.group
                toFieldPath: spec.forProvider.vars[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.roles
                toFieldPath: spec.forProvider.vars[1].value
                transforms:
                  - type: string
                    string:
                      type: Join
                      join:
                        separator: ","
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.group_id
                toFieldPath: status.groupId
