apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: proxmoxgroups.platform.example.io
spec:
  group: platform.example.io
  names:
    kind: ProxmoxGroup
    plural: proxmoxgroups
  claimNames:
    kind: ProxmoxGroupClaim
    plural: proxmoxgroupclaims
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                group:
                  type: string
                  description: Proxmox group name
                roles:
                  type: array
                  items:
                    type: string
                  description: Proxmox role names to assign
              required:
                - group
