apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: proxmoxgroups.platform.shokohsc.com
spec:
  scope: Cluster
  group: platform.shokohsc.com
  names:
    kind: ProxmoxGroup
    plural: proxmoxgroups
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                group:
                  type: string
                  description: Proxmox group name
                roles:
                  type: array
                  items:
                    type: string
                  description: Proxmox role names to assign
              required:
                - group
