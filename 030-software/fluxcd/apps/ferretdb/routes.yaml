---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: ferretdb
  annotations:
    external-dns.kubernetes.io/hostname: ferretdb.${domain}
spec:
  parentRefs:
    - name: cilium
      namespace: cilium
      sectionName: ferretdb
  rules:
    - backendRefs:
        - name: ferretdb
          port: 27017