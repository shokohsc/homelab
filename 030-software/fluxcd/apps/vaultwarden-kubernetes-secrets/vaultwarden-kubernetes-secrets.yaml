---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vaultwarden-kubernetes-secrets
spec:
  interval: ${interval}
  url: oci://ghcr.io/antoniolago/charts/vaultwarden-kubernetes-secrets
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^2.1.0-rc"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-kubernetes-secrets
spec:
  interval: ${interval}
  chartRef:
    kind: OCIRepository
    name: vaultwarden-kubernetes-secrets
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: vaultwarden-kubernetes-secrets
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-permissions
                        resources:
                          limits:
                            cpu: 100m
                            memory: 64Mi
                    containers:
                      - name: vaultwarden-kubernetes-secrets
                        volumeMounts:
                          - name: certs
                            mountPath: /etc/ssl/certs
                    volumes:
                      - name: certs
                        configMap:
                          name: homelab-ca-cm
                          defaultMode: 0600
          - target:
              version: v1
              kind: Deployment
              labelSelector: app.kubernetes.io/name=vaultwarden-kubernetes-secrets
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  metadata:
                    labels:
                      policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
  values:
    global:
      imageTag: "2.1.0-rc"
    api:
      enabled: true
      persistence:
        size: 100Mi
    dashboard:
      enabled: true

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

    env:
      config:
        # VAULTWARDEN__SERVERURL: "https://vaultwarden.${domain}"
        VAULTWARDEN__SERVERURL: "http://vaultwarden.vaultwarden.svc.cluster.local"
        # VAULTWARDEN__ORGANIZATIONID: "unassigned" #RECOMMENDED
        VAULTWARDEN__ORGANIZATIONNAME: "My vault"
        VAULTWARDEN__FOLDERID: "a1bbe1a7-cb62-4a9d-895d-125cd2c51451"
        VAULTWARDEN__FOLDERNAME: "homelab"
        VAULTWARDEN__COLLECTIONID: "" #RECOMMENDED
        VAULTWARDEN__COLLECTIONNAME: ""
        # Optional: Fixed device identifier to prevent "New device logged in" notifications
        # If not set, a deterministic ID is auto-generated from SERVERURL + BW_CLIENTID
        # VAULTWARDEN__DEVICEID: ""
        KUBERNETES__INCLUSTER: "true"
        KUBERNETES__DEFAULTNAMESPACE: "default"
        SYNC__DRYRUN: "true"
        SYNC__DELETEORPHANS: "true"
        SYNC__SECRETPREFIX: ""
        SYNC__SYNCINTERVALSECONDS: "10"
        SYNC__CONTINUOUSSYNC: "true"
        LOGGING__LOGLEVEL__DEFAULT: "Debug"
        LOGGING__LOGLEVEL__MICROSOFT: "Warning"
        LOGGING__LOGLEVEL__MICROSOFT__HOSTING__LIFETIME: "Information"