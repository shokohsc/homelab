---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vaultwarden-kubernetes-secrets
spec:
  interval: ${interval}
  url: oci://ghcr.io/antoniolago/charts/vaultwarden-kubernetes-secrets
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-kubernetes-secrets
spec:
  interval: ${interval}
  chartRef:
    kind: OCIRepository
    name: vaultwarden-kubernetes-secrets
  values:
    api:
      persistence:
        size: 100Mi
    dashboard:
      enabled: true

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

    env:
      config:
        VAULTWARDEN__SERVERURL: "http://vaultwarden.vaultwarden.svc.cluster.local"
        VAULTWARDEN__ORGANIZATIONID: "unassigned" #RECOMMENDED
        VAULTWARDEN__ORGANIZATIONNAME: "My vault"
        VAULTWARDEN__FOLDERID: "a1bbe1a7-cb62-4a9d-895d-125cd2c51451"
        VAULTWARDEN__FOLDERNAME: "homelab"
        VAULTWARDEN__COLLECTIONID: "" #RECOMMENDED
        VAULTWARDEN__COLLECTIONNAME: ""
        # Optional: Fixed device identifier to prevent "New device logged in" notifications
        # If not set, a deterministic ID is auto-generated from SERVERURL + BW_CLIENTID
        # VAULTWARDEN__DEVICEID: ""
        KUBERNETES__INCLUSTER: "true"
        KUBERNETES__DEFAULTNAMESPACE: "default"
        SYNC__DRYRUN: "false"
        SYNC__DELETEORPHANS: "true"
        SYNC__SECRETPREFIX: ""
        SYNC__SYNCINTERVALSECONDS: "10"
        SYNC__CONTINUOUSSYNC: "true"
        LOGGING__LOGLEVEL__DEFAULT: "Information"
        LOGGING__LOGLEVEL__MICROSOFT: "Warning"
        LOGGING__LOGLEVEL__MICROSOFT__HOSTING__LIFETIME: "Information"