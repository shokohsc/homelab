---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pdfcraft
  annotations:
    dashboard.${domain}/name: pdfcraft
    dashboard.${domain}/url: https://pdfcraft.${domain}
    dashboard.${domain}/icon: file-pdf-box
spec:
  hostnames:
  - pdfcraft.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: pdfcraft
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
