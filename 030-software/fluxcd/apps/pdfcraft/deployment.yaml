---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: pdfcraft
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: pdfcraft
  template:
    metadata:
      labels:
        app: pdfcraft
        policy.gatekeeper.sh/ignore-psp-volume-types: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: pdfcraft
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pdfcraft
      containers:
        - name: pdfcraft
          image: busybox:1.38
          args: ["busybox", "httpd", "-f", "-v", "-p", "8080"]
          workingDir: /assets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              port: http
              path: /
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: assets
              mountPath: /assets
              subPath: website/pdfcraft
      volumes:
        - name: assets
          image:
            reference: ghcr.io/pdfcrafttool/pdfcraft:latest@sha256:66f54437ca22d8faf931c5a9a45ea7bc14f11f8199f9f5d151ba3f0a7dff562e