@version: 4.2
@include "scl.conf"

# Source configuration
source s_network {
    network(
        transport("tcp")
        port(8601)
    );
};
# destination d_promtail {
#     syslog(
#         "promtail-syslog.promtail"
#         transport("tcp")
#         port(1601)
#     );
# };
destination d_stdout {
    file("/dev/stdout");
};
# Syslog log configuration
log {
    source(s_network);
    destination(d_stdout);
    # destination(d_promtail);
};
