---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  annotations:
    dashboard.${domain}/icon:  television-classic
    dashboard.${domain}/name: sonarr
    dashboard.${domain}/url: https://sonarr.${domain}
spec:
  hostnames:
  - sonarr.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: sonarr
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
