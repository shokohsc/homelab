---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr-on-steroids
  annotations:
    dashboard.${domain}/icon: music-note
    dashboard.${domain}/name: lidarr-on-steroids
    dashboard.${domain}/url: https://lidarr-on-steroids.${domain}
spec:
  hostnames:
    - lidarr-on-steroids.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: lidarr-on-steroids
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deemix-on-steroids
  annotations:
    dashboard.${domain}/icon: account-music
    dashboard.${domain}/name: deemix-on-steroids
    dashboard.${domain}/url: https://deemix-on-steroids.${domain}
spec:
  hostnames:
    - deemix-on-steroids.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: lidarr-on-steroids
          port: 6595
      matches:
        - path:
            type: PathPrefix
            value: /
