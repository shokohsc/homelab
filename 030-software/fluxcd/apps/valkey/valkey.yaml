---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
spec:
  interval: ${interval}
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
spec:
  interval: ${interval}
  maxHistory: 1
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey
      interval: ${interval}
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                revisionHistoryLimit: 0
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/instance=valkey
  values:
    commonLabels:
      stateful: "true"
    dataStorage:
      enabled: true
      requestedSize: 10Gi
    deploymentStrategy: Recreate
    auth:
      enabled: false
    metrics:
      enabled: false

    initResources:
      limits:
        memory: 64Mi

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
