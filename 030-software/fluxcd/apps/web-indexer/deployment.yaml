---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-indexer
  labels:
    nfs-genji: "true"
    nfs-hanzo: "true"
    nfs-downloads: "true"
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: web-indexer
  template:
    metadata:
      labels:
        app: web-indexer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: web-indexer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web-indexer
      containers:
        - name: web-indexer
          image: ghcr.io/joshbeard/web-indexer/web-indexer:0.9.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - --source
            - /mnt
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: downloads
              mountPath: /mnt/downloads
            - name: genji
              mountPath: /mnt/genji
            - name: hanzo
              mountPath: /mnt/hanzo
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 64Mi
      volumes:
        - name: downloads
          nfs:
            server: 10.99.242.42
            path: /
        - name: genji
          nfs:
            server: genji.${domain}
            path: /
        - name: hanzo
          nfs:
            server: hanzo.${domain}
            path: /
