---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-indexer
  annotations:
    dashboard.${domain}/name: web-indexer
    dashboard.${domain}/url: https://web-indexer.${domain}
    dashboard.${domain}/icon: floppy
spec:
  hostnames:
    - web-indexer.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: web-indexer
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
