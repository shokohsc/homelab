---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid
  annotations:
    configmap.reloader.stakater.com/reload: "config"
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: squid
  template:
    metadata:
      labels:
        app: squid
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9301"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: squid
          image: ubuntu/squid:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3128
              protocol: TCP
          env:
            - name: TZ
              value: ${timezone}
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/spool/squid
            - name: logs
              mountPath: /var/log/squid
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
            - name: config
              mountPath: /etc/squid/acl-dstdomain-localnetsites.cfg
              subPath: acl-dstdomain-localnetsites.cfg
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 512Mi
        - name: squid-exporter
          image: boynux/squid-exporter:v1.13.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9301
              protocol: TCP
          env:
            - name: SQUID_PORT
              value: "3128"
            - name: SQUID_HOSTNAME
              value: localhost
            - name: SQUID_EXPORTER_LISTEN
              value: ":9301"
          startupProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          readinessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 2048Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: squid
        - name: logs
          persistentVolumeClaim:
            claimName: logs
        - name: config
          configMap:
            name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
  annotations:
    configmap.reloader.stakater.com/reload: "config"
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nginx
          image: nginx:1.31.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /static/proxy.pac
              subPath: proxy.pac
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          startupProbe:
            tcpSocket:
              port: http
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 100m
      volumes:
        - name: config
          configMap:
            name: config
            defaultMode: 0644
