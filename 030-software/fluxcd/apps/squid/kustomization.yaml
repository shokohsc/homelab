apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: squid
resources:
  - cilium-network-policy.yaml
  - deployment.yaml
  - namespace.yaml
  - service.yaml
  - http-route.yaml
  - routes.yaml
  - pvc.yaml
  - poddisruptionbudget.yaml
configMapGenerator:
- name: config
  files:
  - ./config/proxy.pac
  - ./config/squid.conf
  - ./config/acl-dstdomain-localnetsites.cfg
generatorOptions:
  disableNameSuffixHash: true
  # annotations:
  #   kustomize.toolkit.fluxcd.io/substitute: disabled
