---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: squid
spec:
  hostnames:
  - squid.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: squid
      port: 3128
    matches:
    - path:
        type: PathPrefix
        value: /
