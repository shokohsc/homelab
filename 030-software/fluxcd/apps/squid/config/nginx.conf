user  nginx;
worker_processes  auto;

error_log /dev/stdout warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
      server_name squid.${domain};
      listen 8080;
      # Define the directory where the PAC file is stored
      root /static; # Replace with the actual directory path

      # Location for the PAC file
      location /proxy.pac {
          default_type application/x-ns-proxy-autoconfig; # Correct MIME type for PAC files
          try_files $uri =404;
      }
    }
}
