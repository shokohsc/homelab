apiVersion: apps/v1
kind: Deployment
metadata:
  name: swingmusic
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: swingmusic
  template:
    metadata:
      labels:
        app: swingmusic
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: swingmusic
          image: ghcr.io/swingmx/swingmusic:v3.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 1000m
              memory: 1024M
            requests:
              cpu: 100m
              memory: 128M
          volumeMounts:
            - name: data
              mountPath: /config
            - name: genji
              mountPath: /music
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: genji
          nfs:
            server: genji.home.arpa
            path: /music/tracks
