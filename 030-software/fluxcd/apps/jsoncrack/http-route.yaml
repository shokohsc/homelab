---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jsoncrack
  annotations:
    dashboard.${domain}/name: jsoncrack
    dashboard.${domain}/url: https://jsoncrack.${domain}/editor
    dashboard.${domain}/icon: code-json
spec:
  hostnames:
  - jsoncrack.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: jsoncrack
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
