apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blossom
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - pvc.yaml
configMapGenerator:
  - name: config
    files:
      - ./config/config.yml
generatorOptions:
  disableNameSuffixHash: true
