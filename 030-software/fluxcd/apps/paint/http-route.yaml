---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paint
  annotations:
    dashboard.${domain}/name: paint
    dashboard.${domain}/url: https://paint.${domain}
    dashboard.${domain}/icon: brush
spec:
  hostnames:
  - paint.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: paint
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
