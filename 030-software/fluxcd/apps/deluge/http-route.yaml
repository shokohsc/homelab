---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deluge
spec:
  hostnames:
    - deluge.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: deluge
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
