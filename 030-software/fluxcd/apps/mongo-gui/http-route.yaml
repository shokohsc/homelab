---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mongo-gui
  annotations:
    dashboard.${domain}/icon: database
    dashboard.${domain}/name: mongo-gui
    dashboard.${domain}/url: https://mongo-gui.${domain}
spec:
  hostnames:
  - mongo-gui.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: mongo-gui
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
