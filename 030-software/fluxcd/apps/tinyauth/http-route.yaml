---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tinyauth
spec:
  hostnames:
  - tiny.auth.${domain}
  parentRefs:
  - name: tinyauth
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: tinyauth
  rules:
  - backendRefs:
    - name: tinyauth
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /