---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: tinyauth
  annotations:
    cert-manager.io/cluster-issuer: ca-cluster-issuer
spec:
  parentRef:
    namespace: cilium
    name: cilium
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
  - name: tinyauth
    hostname: tiny.auth.${domain}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: tinyauth-cert
