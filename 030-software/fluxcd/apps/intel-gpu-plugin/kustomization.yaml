apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intel-gpu-plugin
resources:
  - namespace.yaml
  - https://github.com/intel/intel-device-plugins-for-kubernetes/raw/refs/heads/main/deployments/gpu_plugin/overlays/nfd_labeled_nodes/kustomization.yaml
patches:
  # - patch: |-
  #     - op: replace
  #       path: /metadata/name
  #       value: homelab
  #     - op: replace
  #       path: /spec/contexts/0/text
  #       value: |
  #         You're running inside a container's pod in a talos cluster with a strict pod security policy, 
  #         means read only root filesystem, non root user, user with 1000 uid and gid.
  #         Available workspace is at /workspace.
  #         No container runtime is available so no docker commands.
  #         Add changes as a pull request to the homelab repo.
  #     - op: add
  #       path: /spec/contexts/-
  #       value:
  #         name: homelab-repo
  #         type: Git
  #         git:
  #           repository: https://github.com/shokohsc/homelab.git
  #           ref: main
  #         mountPath: homelab/
  #   target:
  #     group: kubeopencode.io
  #     version: v1alpha1
  #     kind: AgentTemplate
  #     name: opencode
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: all
      spec:
        template:
          metadata:
            labels:
              policy.gatekeeper.sh/ignore: "true"
          spec:
            containers:
              - name: intel-gpu-plugin
                image: intel/intel-gpu-plugin:0.37.1
                args:
                  - -shared-dev-num
                  - "2"
            nodeSelector:
              kubernetes.io/hostname: mercy
            tolerations:
              - effect: NoSchedule
                key: node.kubernetes.io/nuc
                operator: Exists
    target:
      kind: DaemonSet
      labelSelector: app=intel-gpu-plugin
