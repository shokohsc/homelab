---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
spec:
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redisinsight
          image: redislabs/redisinsight:3.8.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RILOGLEVEL
              value: "DEBUG"
            - name: RITRUSTEDORIGINS
              value: "https://redisinsight.${domain}"
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64M
            limits:
              cpu: 1000m
              memory: 256M
          volumeMounts:
            - name: db
              mountPath: /db
      volumes:
        - name: db
          emptyDir: {}
