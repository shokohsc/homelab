apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads
  labels:
    app: downloads
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: downloads
  template:
    metadata:
      labels:
        app: downloads
        policy.gatekeeper.sh/ignore: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: downloads
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: downloads
      containers:
        - name: nfs-server-alpine
          image: itsthenetwork/nfs-server-alpine:latest@sha256:7fa99ae65c23c5af87dd4300e543a86b119ed15ba61422444207efc7abd0ba20 # Find an alpine image that has nfsdcld
          securityContext:
            privileged: true
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpc
              containerPort: 111
              protocol: TCP
          volumeMounts:
            - name: downloads
              mountPath: /exports
            # - name: nfsdcld
            #   mountPath: /var/lib/nfs/nfsdcld
          lifecycle:
            postStart:
              exec:
                # command: ["/bin/sh", "-c", "chmod 777 /exports && nfsdcld"]
                command: ["/bin/sh", "-c", "chmod 777 /exports"]
          startupProbe:
            tcpSocket:
              port: nfs
          livenessProbe:
            tcpSocket:
              port: nfs
          readinessProbe:
            tcpSocket:
              port: nfs
          resources:
            limits:
              memory: 1024Mi
            requests:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        # - name: nfsdcld
        #   emptyDir:
        #     medium: Memory
