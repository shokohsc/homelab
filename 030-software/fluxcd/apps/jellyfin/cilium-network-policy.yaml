apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
spec:
  endpointSelector: {}
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyfin
    # Jellyfin web interface
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
          rules:
            dns: []
    - toPorts:
        - ports:
            - port: "7359"
              protocol: TCP
          rules:
            dns: []
    - toPorts:
        - ports:
            - port: "1900"
              protocol: UDP
          rules:
            dns: []
    - toCIDR:
        - ${cidr}
    - toEntities:
        - world
