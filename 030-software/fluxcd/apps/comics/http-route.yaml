---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: comics
  annotations:
    dashboard.${domain}/name: comics
    dashboard.${domain}/url: https://comics.${domain}
    dashboard.${domain}/icon: chat
spec:
  hostnames:
  - comics.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: comics
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
