---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: comics
spec:
  selector:
    matchLabels:
      app: comics
  template:
    metadata:
      labels:
        app: comics
        policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
        policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
        policy.gatekeeper.sh/ignore-psp-capabilities-baseline: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        # runAsNonRoot: true
        # runAsUser: 1000
        # runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: comics
          image: shokohsc/ouistity:b8ba4de
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: true
            # runAsNonRoot: true
            # capabilities:
            #   drop:
            #     - ALL
          env:
            - name: ENV
              value: production
            - name: API_GATEWAY_HOST
              value: api.comics.${domain}
            - name: GRAPHQL_GATEWAY_HOST
              value: apollo.comics.${domain}
            - name: GRAPHQL_CACHE_TTL
              value: "600"
            - name: USE_SENTRY
              value: "false"
            # - name: SENTRY_DSN
            #   value: https://a8a984e25f134ddfae31c6e88ed3b4d8\@glitchtip.${domain}/2
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
