apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zipkin
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
- name: config
  files:
  - ./config/vector.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
