---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels:
    app: zipkin
  annotations:
    configmap.reloader.stakater.com/reload: "config"
spec:
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9411"
      prometheus.io/path: /prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vector
          image: timberio/vector:0.58.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - --config
            - /etc/vector/vector.yaml
          ports:
            - name: vector
              containerPort: 9412
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: vector
          livenessProbe:
            tcpSocket:
              port: vector
          readinessProbe:
            tcpSocket:
              port: vector
          resources:
            requests:
              cpu: 10m
              memory: 64M
            limits:
              cpu: 1000m
              memory: 256M
          volumeMounts:
            - name: config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
      volumes:
        - name: config
          configMap:
            name: config
            defaultMode: 0644
