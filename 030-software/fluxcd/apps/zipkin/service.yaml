---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    app: zipkin
spec:
  type: ClusterIP
  ports:
    # - port: 80
    #   targetPort: http
    #   protocol: TCP
    #   name: http
    - port: 80
      targetPort: vector
      protocol: TCP
      name: http
    - port: 9411
      targetPort: vector
      protocol: TCP
      name: vector
  selector:
    app: zipkin
