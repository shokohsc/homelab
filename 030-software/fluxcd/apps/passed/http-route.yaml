---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: libreddit
  annotations:
    dashboard.${domain}/name: passed
    dashboard.${domain}/url: https://passed.${domain}
    dashboard.${domain}/icon: share-all
spec:
  hostnames:
  - libreddit.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: libreddit
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
