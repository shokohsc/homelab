---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: instancez
spec:
  interval: ${interval}
  url: https://github.com/instancez/instancez
  ref:
    branch: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: instancez
spec:
  interval: ${interval}
  chart:
    spec:
      chart: ./helm/instancez
      sourceRef:
        kind: GitRepository
        name: instancez
      interval: ${interval}
  valuesFrom:
    - kind: Secret
      name: credentials
      valuesKey: postgres-url
      targetPath: externalPostgres.url # full superuser DSN: postgres://user:pass@host:5432/db
  values:
    image:
      repository: ghcr.io/instancez/instancez
    # # API keys — auto-generated with the inz_publishable_/inz_secret_ prefixes if
    # # empty (see Secret section). The publishable key is client-safe (anon role);
    # # the secret key is server-side (service_role) and gates the admin API.
    # publishableKey: ""
    # secretKey: ""

    # Raw instancez.yaml block — written to a ConfigMap and mounted at /app/instancez.yaml
    config: |
      version: 1
      project:
        name: instancez
      server:
        port: 8080
      # tables:
      #   posts:
      #     fields:
      #       - name: id
      #         type: bigserial
      #         primary_key: true
      #       - name: user_id
      #         foreign_key:
      #           references: auth.users.id
      #           on_delete: cascade
      #       - name: title
      #         type: text
      #         required: true
      #       - name: published_at
      #         type: timestamptz
      #         default: now()
      # providers:
      #   storage:
      #     type: s3
      #     bucket: instancez
      #     region: homelab
      #     access_key_id: "${MY_S3_ACCESS_KEY_ID}"
      #     secret_access_key: "${MY_S3_SECRET_ACCESS_KEY}"
      #     endpoint: http://rustfs-svc.rustfs.svc.cluster.local:9001

    postgres:
      enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 1024Mi