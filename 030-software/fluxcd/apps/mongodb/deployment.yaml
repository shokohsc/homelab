---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: mongodb
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mongodb
      containers:
        - name: mongodb
          image: mongo:9.0.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: mongodb
          livenessProbe:
            tcpSocket:
              port: mongodb
          readinessProbe:
            tcpSocket:
              port: mongodb
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1024Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb
        - name: tmp
          emptyDir: {}
