---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: mongodb
  annotations:
    external-dns.kubernetes.io/hostname: mongodb.${domain}
spec:
  parentRefs:
    - name: cilium
      namespace: cilium
      sectionName: mongodb
  rules:
    - backendRefs:
        - name: mongodb
          port: 27017