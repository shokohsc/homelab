---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-mirror
  annotations:
    dashboard.${domain}/name: git-mirror
    dashboard.${domain}/url: https://git-mirror.${domain}
    dashboard.${domain}/icon: code-branch
spec:
  hostnames:
  - git-mirror.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: git-mirror
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
