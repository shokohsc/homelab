apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: git-mirror
resources:
  - namespace.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - service.yaml
  - pvc.yaml
  - http-route.yaml
configMapGenerator:
- name: config
  files:
  - ./config/config.toml
generatorOptions:
  disableNameSuffixHash: true
