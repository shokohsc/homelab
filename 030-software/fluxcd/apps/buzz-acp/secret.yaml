apiVersion: v1
kind: Secret
metadata:
  name: buzz-acp
type: Opaque
# TODO(operator): replace every placeholder, then encrypt this file before committing:
#   sops --encrypt --in-place 030-software/fluxcd/apps/buzz-acp/secret.yaml
# See README.md in this directory for how to produce the values. The private key is a
# Nostr identity, never commit it in plaintext.
stringData:
  # Agent Nostr identity, from `buzz-admin generate-key` (hex secret or nsec1...).
  BUZZ_PRIVATE_KEY: "REPLACE_ME_agent_nostr_secret_key"
  # Your 64 hex char relay owner pubkey (the same identity you use in the Buzz app).
  BUZZ_ACP_AGENT_OWNER: "REPLACE_ME_64_char_hex_owner_pubkey"
