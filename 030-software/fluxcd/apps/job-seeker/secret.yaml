---
# Empty on purpose: the password is generated by CloudNativePG, see
# ../cloudnativepg/database-roles/job-seeker.yaml, so the connection string can
# only be assembled once that role exists and the Deployment stays pending until
# this Secret has a DATABASE_URL key.
#
#   kubectl -n cnpg-system get secret job-seeker \
#     -o jsonpath='{.data.username}' | base64 -d
#   kubectl -n cnpg-system get secret job-seeker \
#     -o jsonpath='{.data.password}' | base64 -d
#
# Add them to stringData as
#
#   postgresql://job-seeker:<password>@main-rw.cnpg-system.svc.cluster.local:5432/job-seeker
#
# and then encrypt, every other Secret in this repo is SOPS encrypted and this
# file MUST NOT be merged unencrypted:
#
#   sops --encrypt --in-place --pgp CA2DD399363326254636047B16327B7FD73D8969 \
#     030-software/fluxcd/apps/job-seeker/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: job-seeker
  namespace: job-seeker
type: Opaque
