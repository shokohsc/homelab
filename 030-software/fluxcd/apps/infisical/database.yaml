apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: infisical
spec:
  name: infisical
  owner: infisical
  cluster:
    name: main
    namespace: cnpg-system
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: infisical
spec:
  cluster:
    name: main
    namespace: cnpg-system
  name: infisical
  login: true
  superuser: false
  createdb: false
  createrole: false
  passwordSecret:
    name: database
