---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infisical
spec:
  hostnames:
  - infisical.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: infisical-infisical-standalone-infisical
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
