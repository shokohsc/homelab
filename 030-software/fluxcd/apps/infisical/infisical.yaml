---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: infisical
spec:
  interval: ${interval}
  url: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
spec:
  interval: ${interval}
  chart:
    spec:
      chart: infisical-standalone
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: infisical
      interval: ${interval}
  values:
    infisical:
      enabled: true
      autoBootstrap:
        enabled: false
        organization: homelab
      extraEnv:
        - name: ALLOW_INTERNAL_IP_CONNECTIONS
          value: "true"
      resources:
        limits:
          cpu: 1000m
          memory: 2048Mi
        requests:
          cpu: 350m
      extraVolumeMounts:
        - name: temp
          mountPath: /tmp
      extraVolumes:
        - name: temp
          emptyDir:
            medium: Memory
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    kubeSecretRef: infisical-secrets
    ingress:
      enabled: false
      nginx:
        enabled: false
    postgresql:
      enabled: false
    redis:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secret-operator
spec:
  interval: ${interval}
  chart:
    spec:
      chart: secrets-operator
      version: v0.11.8
      sourceRef:
        kind: HelmRepository
        name: infisical
      interval: ${interval}
  values:
    # hostAPI: "https://infisical.${domain}/api"
    hostAPI: "http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080"
    controllerManager:
      manager:
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
