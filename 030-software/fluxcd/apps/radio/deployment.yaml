---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: radio-server
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: radio-server
  template:
    metadata:
      labels:
        app: radio-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radio-server
          image: ghcr.io/shokohsc/radio-server:sha-1ab71f5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ENV
              value: production
            - name: MUSIC_DIR
              value: /music
            - name: NODE_OPTIONS
              value: "--trace-warnings"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              port: http
              path: /health
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1024Mi
          volumeMounts:
            - name: genji
              mountPath: /music
      volumes:
        - name: genji
          nfs:
            server: genji.home.arpa
            path: /music/tracks
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: radio-ui
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: radio-ui
  template:
    metadata:
      labels:
        app: radio-ui
        policy.gatekeeper.sh/ignore-psp-volume-types: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radio-ui
          image: busybox:1.38
          args: ["busybox", "httpd", "-f", "-v", "-p", "8080"]
          workingDir: /assets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              port: http
              path: /
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: assets
              mountPath: /assets
      volumes:
        - name: assets
          image:
            reference: ghcr.io/shokohsc/radio-ui:sha-1ab71f5