---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: allow
spec:
  hostnames:
  - allow.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: allow
      port: 12345
    matches:
    - path:
        type: PathPrefix
        value: /
