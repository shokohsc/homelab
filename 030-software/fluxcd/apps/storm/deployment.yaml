---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storm
  labels:
    app: storm
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: storm
  template:
    metadata:
      labels:
        app: storm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: storm
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: storm
      containers:
      - name: storm
        image: ghcr.io/relvacode/storm:v1.3.0@sha256:9f50d643af5a83424331a93a212e320407a1a1577f0202e6141f7f5245d2711a
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        env:
        - name: DELUGE_RPC_HOSTNAME
          value: deluge.deluge
        - name: DELUGE_RPC_PORT
          value: "58846"
        - name: DELUGE_RPC_USERNAME
          value: flood
        - name: DELUGE_RPC_PASSWORD
          value: flood
        - name: DELUGE_RPC_VERSION
          value: v2
        ports:
        - name: http
          containerPort: 8221
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
        readinessProbe:
          httpGet:
            path: /
            port: http
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
