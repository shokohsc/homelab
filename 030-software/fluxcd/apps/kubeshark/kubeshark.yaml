---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubeshark
spec:
  interval: ${interval}
  url: https://helm.kubeshark.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeshark
spec:
  interval: ${interval}
  chart:
    spec:
      chart: kubeshark
      version: 53.4.0
      sourceRef:
        kind: HelmRepository
        name: kubeshark
      interval: ${interval}
  # The chart renders four NetworkPolicy objects unconditionally (there is no
  # values key to turn them off) and kubeshark-worker-network-policy selects the
  # worker pods, which run with hostNetwork: true. Cilium enforces network policy
  # through bpf.tproxy on this cluster, so that policy lands on the node's host
  # endpoint and drops everything that is not TCP 48999/49100. Delete them all;
  # the kubeshark namespace is already exempt from the repo's own policies.
  postRenderers:
    - kustomize:
        patches:
          - |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: kubeshark-hub-network-policy
              namespace: kubeshark
          - |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: kubeshark-front-network-policy
              namespace: kubeshark
          - |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: kubeshark-dex-network-policy
              namespace: kubeshark
          - |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: kubeshark-worker-network-policy
              namespace: kubeshark
  values:
    tap:
      release:
        namespace: kubeshark

      # tap.auth.enabled is forced true whenever cloudLicenseEnabled, so the hub
      # resolves every caller to this role. The chart ships kubeshark-viewer,
      # which has no dissection:control and no pods:target:write, which would
      # leave the dashboard's Resume/Pause button and the Settings dialog
      # permanently disabled. The docs claim the default is kubeshark-admin; the
      # chart says otherwise, so set it.
      # Docs: https://docs.kubeshark.com/en/roles
      auth:
        defaultRole: kubeshark-admin

      # Boot dormant. The dashboard then shows a green "Resume Traffic Indexing"
      # button top-left and a red "Pause Traffic Indexing" button while running,
      # and dissection.stopAfter pauses it again after 5m of nobody looking.
      # Docs: https://docs.kubeshark.com/en/on_off_switch
      capture:
        dissection:
          enabled: false
          stopAfter: 5m

      # Never capture the cluster's own plumbing. Docs recommend this over an
      # allow-list here because every app in this homelab owns a namespace, so
      # an allow-list would mean a Git commit per app you want to debug.
      # Narrow further from the dashboard Settings dialog, which applies
      # cluster-wide and immediately.
      # Docs: https://docs.kubeshark.com/en/pod_targeting
      excludedNamespaces:
      - kube-system
      - cilium
      - flux-system
      - gatekeeper-system
      - cert-manager
      - crossplane-system
      - cnpg-system
      - ceph-csi
      - karpenter-proxmox
      - talos-proxmox-autoscaler
      - proxmox
      - nfs-proxmox
      - nfs-downloads
      - kubeopencode
      - workspace
      - kubeshark

      # Interface-level capture only. The eBPF backend additionally taps XDP and
      # the kernel, which is what collided with this cluster's Cilium datapath
      # (bpf.tproxy, bpf.hostLegacyRouting, bpf.masquerade, L7 Envoy).
      # af_packet needs only NET_RAW+NET_ADMIN and is the one backend that
      # honours bpfOverride, the hard off switch in dashboard Settings.
      # Docs: https://docs.kubeshark.com/en/packet_capture
      packetCapture: af_packet

      # Talos has an immutable rootfs and statically linked binaries, so there is
      # nothing for the TLS tracer to read out of the host's / anyway. This also
      # drops the tracer container and the read-only host / mount entirely.
      tls: false

      # Cilium runs its L7 load balancer through Envoy
      # (loadBalancer.l7.backend: envoy in cilium.values.yaml), which -servicemesh
      # would attach to.
      serviceMesh: false

      # The chart wraps capabilities.add/drop in `if not privileged`, so the
      # previous privileged: true ran fully privileged sniffers on every node and
      # silently discarded the capability list that sat next to it. false is what
      # makes the chart's own defaults (NET_RAW, NET_ADMIN + ebpfCapture) apply.
      securityContext:
        privileged: false

      # Must stay true: AF_PACKET in a pod netns would only see that pod's veth.
      hostNetwork: true

      # Talos already mounts bpffs at /sys/fs/bpf for Cilium, so the mount-bpf
      # init container's mount is a no-op there. It is hardcoded privileged
      # upstream and cannot be scoped down.
      mountBpf: true

      # Homelab forwards IPv6, so the dissectors should keep matching v6.
      ipv6: true
      storageLimit: 1Gi

      resources:
        hub:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        sniffer:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

      enabledDissectors:
      - dns
      - http
      - postgresql
      - redis
      - ws
      - tlsx
      - udp-flow
      - tcp-flow
      - udp-conn
      - tcp-conn
      portMapping:
        http:
        - 80
        - 443
        - 8080
        postgresql:
        - 5432
        redis:
        - 6379
      customMacros:
        https: tls and (http or http2)

      labels:
        app: kubeshark
        policy.gatekeeper.sh/ignore: "true"
