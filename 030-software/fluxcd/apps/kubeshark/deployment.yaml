
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeshark-hub
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: kubeshark-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          command:
            - /service
            - -port
            - "8080"
            - -loglevel
            - 'warning'
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # Advertised to the front and the workers so they can target this hub
          # by its cluster FQDN (must match the namespace this chart installs into).
          - name: HUB_FQDN
            value: 'kubeshark-hub.kubeshark.svc.cluster.local'
          - name: SENTRY_ENABLED
            value: 'false'
          - name: SENTRY_ENVIRONMENT
            value: 'production'
          - name: PROFILING_ENABLED
            value: 'false'
          image: 'ghcr.io/shokohsc/hub:sha-b74f7a8'
          readinessProbe:
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 5
            tcpSocket:
              port: 8080
          livenessProbe:
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 5
            tcpSocket:
              port: 8080
          resources:
            limits:
              memory: 4096Mi
            requests:
              cpu: 50m
              memory: 50Mi
          volumeMounts:
          - name: saml-x509-volume
            mountPath: "/etc/saml/x509"
            readOnly: true
          - name: snapshots-volume
            mountPath: "/app/data/snapshots"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      volumes:
      - name: saml-x509-volume
        projected:
          sources:
          - secret:
              name: kubeshark-saml-x509-crt-secret
              items:
              - key: AUTH_SAML_X509_CRT
                path: kubeshark.crt
          - secret:
              name: kubeshark-saml-x509-key-secret
              items:
              - key: AUTH_SAML_X509_KEY
                path: kubeshark.key
      - name: snapshots-volume
        emptyDir:
          sizeLimit: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeshark-front
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            # HUB_URL is the hub Service's cluster FQDN this front proxies
            # /api, /saml and /ws to (must match the namespace the chart installs into).
            - name: HUB_URL
              value: 'http://kubeshark-hub.kubeshark.svc.cluster.local'
            - name: REACT_APP_AUTH_ENABLED
              value: 'false'
            - name: REACT_APP_AUTH_TYPE
              value: 'saml'
            - name: REACT_APP_COMPLETE_STREAMING_ENABLED
              value: 'true'
            - name: REACT_APP_STREAMING_TYPE
              value: 'connect-rpc'
            - name: REACT_APP_AUTH_SAML_IDP_METADATA_URL
              value: ' '
            - name: REACT_APP_TIMEZONE
              value: ' '
            - name: REACT_APP_SCRIPTING_HIDDEN
              value: 'true'
            - name: REACT_APP_SCRIPTING_DISABLED
              value: 'true'
            - name: REACT_APP_BPF_OVERRIDE_DISABLED
              value: 'true'
            - name: REACT_APP_DISSECTION_ENABLED
              value: 'true'
            - name: 'REACT_APP_CLOUD_LICENSE_ENABLED'
              value: 'true'
            - name: REACT_APP_SUPPORT_CHAT_ENABLED
              value: 'false'
            - name: REACT_APP_BETA_ENABLED
              value: 'false'
            - name: REACT_APP_CLUSTER_WIDE_MAP_ENABLED
              value: 'false'
            - name: REACT_APP_RAW_CAPTURE_ENABLED
              value: 'true'
            - name: REACT_APP_ENTRIES_LIMIT
              value: '300000'
            - name: REACT_APP_SENTRY_ENABLED
              value: 'false'
            - name: REACT_APP_SENTRY_ENVIRONMENT
              value: 'production'
          image: 'ghcr.io/shokohsc/front:sha-b74f7a8'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          name: kubeshark-front
          livenessProbe:
            periodSeconds: 1
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 3
            tcpSocket:
              port: 8080
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 3
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 750m
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 50Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: kubeshark-service-account