---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postal
  annotations:
    dashboard.${domain}/name: postal
    dashboard.${domain}/url: https://postal.${domain}
    dashboard.${domain}/icon: email
spec:
  hostnames:
  - postal.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: postal
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
