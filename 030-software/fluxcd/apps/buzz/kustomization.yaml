apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buzz
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - listener-set.yaml
  - pvc.yaml
  - secret.yaml
configMapGenerator:
  - name: config
    files:
      - ./config/config.json
generatorOptions:
  disableNameSuffixHash: true
