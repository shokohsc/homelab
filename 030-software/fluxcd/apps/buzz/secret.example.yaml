---
apiVersion: v1
kind: Secret
metadata:
  name: buzz
stringData:
  # The relay's own Nostr identity, advertised in NIP-11. Rotating it
  # invalidates the community the relay created, so never change it.
  #   docker run --rm --entrypoint /usr/local/bin/buzz-admin ghcr.io/block/buzz:v0.5.2 generate-key
  BUZZ_RELAY_PRIVATE_KEY: CHANGE_ME
  # Your own Nostr pubkey. The owner cannot be removed by buzz-admin, not even by itself.
  RELAY_OWNER_PUBKEY: CHANGE_ME
  # openssl rand -hex 32
  BUZZ_GIT_HOOK_HMAC_SECRET: CHANGE_ME
  # Password of the `buzz` DatabaseRole, created by CloudNativePG:
  #   kubectl get secret buzz -n cnpg-system -o jsonpath='{.data.password}' | base64 -d
  POSTGRES_PASSWORD: CHANGE_ME
  # MinIO root credentials, also used as the buzz S3 credentials. Min access is 3 characters, min secret 8.
  #   openssl rand -hex 16
  BUZZ_S3_ACCESS_KEY: CHANGE_ME
  #   openssl rand -hex 32
  BUZZ_S3_SECRET_KEY: CHANGE_ME
