---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: buzz
  annotations:
    dashboard.${domain}/name: buzz
    dashboard.${domain}/url: https://buzz.${domain}
    dashboard.${domain}/icon: message-circle
spec:
  hostnames:
  - buzz.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: buzz
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
spec:
  hostnames:
  - media.buzz.${domain}
  parentRefs:
  - name: buzz
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: media
  rules:
  - backendRefs:
    - name: buzz
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - cors:
        allowOrigins:
        - https://buzz.${domain}
        allowMethods:
        - GET
        - OPTIONS
        allowHeaders:
        - DNT
        - X-CustomHeader
        - Keep-Alive
        - User-Agent
        - X-Requested-With
        - If-Modified-Since
        - Cache-Control
        - Content-Type
        allowCredentials: false
        maxAge: 3600
      type: CORS
