---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deemix
  annotations:
    dashboard.${domain}/icon: account-music
    dashboard.${domain}/name: deemix
    dashboard.${domain}/url: https://deemix.${domain}
spec:
  hostnames:
    - deemix.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: deemix
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
