---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo
spec:
  hostnames:
  - sftpgo.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: sftpgo
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
