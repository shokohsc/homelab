---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shell2http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shell2http
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shell2http
subjects:
  - kind: ServiceAccount
    namespace: shell2http
    name: shell2http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shell2http
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
