apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - namespace.yaml
  - grafana.yaml
configMapGenerator:
- name: dashboards
  files:
  # - ./dashboards/blocky.json
  - ./dashboards/external-disks.json
  - ./dashboards/global-cluster-view.json
  - ./dashboards/intel-prometheus.json
  - ./dashboards/kubernetes-events.json
  - ./dashboards/loki-promtail.json
  - ./dashboards/nfs.json
  # - ./dashboards/open-weather-map.json
  - ./dashboards/profiles-requests.json
  - ./dashboards/pvc-usage.json
  - ./dashboards/squid-dashboard.json
  # - ./dashboards/storage-io-statistics.json
  - ./dashboards/pod-spread.json
  - ./dashboards/cert-manager.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: k8s-gitops