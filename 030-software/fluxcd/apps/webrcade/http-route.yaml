---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webrcade
  annotations:
    dashboard.${domain}/name: webrcade
    dashboard.${domain}/url: https://webrcade.${domain}
    dashboard.${domain}/icon: gamepad
spec:
  hostnames:
    - webrcade.${domain}
  parentRefs:
    - name: cilium
      namespace: cilium
  rules:
    - backendRefs:
        - name: webrcade
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
