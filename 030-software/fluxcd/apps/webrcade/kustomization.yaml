apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webrcade
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
configMapGenerator:
- name: feeds
  files:
  - ./feeds/feed.json
generatorOptions:
  disableNameSuffixHash: true

# To add roms to default feed
# jq --argjson gbaGames "$(<feeds/gba-roms-feed.json)" '.categories[6].items+= $gbaGames' feeds/default-feed.json
