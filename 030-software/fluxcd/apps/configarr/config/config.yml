---
trashGuideUrl: https://github.com/TRaSH-Guides/Guides
recyclarrConfigUrl: https://github.com/recyclarr/config-templates

sonarr:
  instance1:
    base_url: http://sonarr.sonarr.svc.cluster.local
    api_key: !env SONARR_API_KEY
    quality_definition:
      type: series
      include:
        - template: sonarr-quality-definition-series
    quality_profiles:
      - name: WEB-1080p
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
      - name: WEB-2160p
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
    custom_formats: []
    include:
      - template: sonarr-quality-profile-web-1080p
      - template: sonarr-custom-formats-web-1080p
      - template: sonarr-quality-profile-web-2160p
      - template: sonarr-custom-formats-web-2160p

radarr:
  instance1:
    base_url: http://radarr.radarr.svc.cluster.local
    api_key: !env RADARR_API_KEY
    quality_definition:
      type: movie
      include:
        - template: radarr-quality-definition-movie
    quality_profiles:
      - name: WEB-1080p
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
      - name: WEB-2160p
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
    custom_formats: []
    include:
      - template: radarr-quality-profile-web-1080p
      - template: radarr-custom-formats-web-1080p
      - template: radarr-quality-profile-web-2160p
      - template: radarr-custom-formats-web-2160p
