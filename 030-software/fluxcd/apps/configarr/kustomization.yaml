apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: configarr
resources:
  - namespace.yaml
  - cronjob.yaml
  # Requires the sonarr/radarr api keys: create secret.yaml, fill it, then
  # `sops --encrypt --in-place secret.yaml` and uncomment this line.
  # - secret.yaml
configMapGenerator:
- name: config
  files:
  - ./config/config.yml
generatorOptions:
  disableNameSuffixHash: true
