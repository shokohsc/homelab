apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: descheduler
resources:
  - namespace.yaml
  - cronjob.yaml
  - rbac.yaml
configMapGenerator:
- name: config
  files:
  - ./config/policy.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
