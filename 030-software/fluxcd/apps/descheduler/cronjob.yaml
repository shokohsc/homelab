---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: descheduler
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: descheduler
          labels:
            app: descheduler
        spec:
          priorityClassName: system-cluster-critical
          serviceAccountName: descheduler-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: descheduler
              image: registry.k8s.io/descheduler/descheduler:v0.36.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              command:
                - "/bin/descheduler"
              args:
                - "--policy-config-file"
                - "/policy-dir/policy.yaml"
                - "--v"
                - "3"
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 200m
              volumeMounts:
                - mountPath: /policy-dir/policy.yaml
                  subPath: policy.yaml
                  name: policy-volume
          volumes:
          - name: policy-volume
            configMap:
              name: config
