---
apiVersion: v1
kind: Service
metadata:
  name: tcpmux
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: tcpmux
    protocol: TCP
    name: tcpmux
  selector:
    app: neko
---
apiVersion: v1
kind: Service
metadata:
  name: udpmux
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: udpmux
    protocol: UDP
    name: udpmux
  selector:
    app: neko
---
apiVersion: v1
kind: Service
metadata:
  name: neko
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: neko
