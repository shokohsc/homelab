apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neko
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - routes.yaml
  - cilium-network-policy.yaml
configMapGenerator:
- name: policies
  files:
  - ./policies/firefox.json
generatorOptions:
  disableNameSuffixHash: true
