---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: neko
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neko
  policyTypes:
    - Egress
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            namespace: pod-gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: pod-gateway
