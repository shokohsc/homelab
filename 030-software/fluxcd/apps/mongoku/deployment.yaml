---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoku
spec:
  selector:
    matchLabels:
      app: mongoku
  template:
    metadata:
      labels:
        app: mongoku
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: mongoku
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mongoku
      containers:
        - name: mongoku
          image: huggingface/mongoku:2.11.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MONGOKU_DEFAULT_HOST
              value: "mongodb://mongodb.mongodb.svc.cluster.local:27017"
            - name: MONGOKU_SERVER_ORIGIN
              value: https://mongoku.${domain}
            - name: MONGOKU_EXCLUDE_DATABASES
              value: admin,config,local
            - name: MONGOKU_DATABASE_FILE
              value: /tmp/mongoku.db
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              memory: 64M
            requests:
              cpu: 100m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
