---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mongoku
  annotations:
    dashboard.${domain}/icon: database
    dashboard.${domain}/name: mongoku
    dashboard.${domain}/url: https://mongoku.${domain}
spec:
  hostnames:
  - mongoku.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: mongoku
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
