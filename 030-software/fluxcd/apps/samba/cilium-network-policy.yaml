apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: samba
spec:
  endpointSelector: {}
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: samba
    # Samba file sharing
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: samba
      toPorts:
        - ports:
            - port: "139"
              protocol: TCP
          rules:
            dns: []
    - toPorts:
        - ports:
            - port: "445"
              protocol: TCP
          rules:
            dns: []
    - toCIDR:
        - ${cidr}
