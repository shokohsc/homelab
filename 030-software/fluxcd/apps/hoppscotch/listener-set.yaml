---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: hoppscotch
  annotations:
    cert-manager.io/cluster-issuer: ca-cluster-issuer
spec:
  parentRef:
    namespace: cilium
    name: cilium
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
  - name: admin
    hostname: admin.hoppscotch.${domain}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: admin-cert
  - name: api
    hostname: api.hoppscotch.${domain}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: api-cert
