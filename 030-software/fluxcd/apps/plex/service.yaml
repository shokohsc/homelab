---
apiVersion: v1
kind: Service
metadata:
  name: plex
spec:
  type: ClusterIP
  ports:
  - port: 32400
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: plex
---
apiVersion: v1
kind: Service
metadata:
  name: dnla-tcp
spec:
  type: ClusterIP
  ports:
  - port: 32469
    targetPort: dnla-tcp
    protocol: TCP
    name: dnla-tcp
  selector:
    app: plex
---
apiVersion: v1
kind: Service
metadata:
  name: dnla-udp
spec:
  type: ClusterIP
  ports:
  - port: 1900
    targetPort: dnla-udp
    protocol: UDP
    name: dnla-udp
  selector:
    app: plex
