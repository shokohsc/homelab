data_dir: /var/lib/vector
sources:
  plex:
    type: file
    include:
      - "/plex/etc/Library/Application Support/Plex Media Server/Logs/*.log"

sinks:
  loki:
    type: loki
    inputs:
      - plex
    endpoint: "http://loki-gateway.loki.svc.cluster.local"
    encoding:
      codec: json
    labels:
      job: plex
