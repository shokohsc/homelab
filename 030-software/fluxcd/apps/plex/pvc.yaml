---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: config
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: transcode
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "20Gi"
  storageClassName: temp
