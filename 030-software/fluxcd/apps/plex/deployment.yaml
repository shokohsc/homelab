---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  annotations:
    configmap.reloader.stakater.com/reload: "vector,s6-plex"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
        nfs-genji: "true"
        policy.gatekeeper.sh/ignore-container-must-have-limits: "true"
        policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
        policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
        policy.gatekeeper.sh/ignore-psp-capabilities-baseline: "true"
        policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: plex
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: plex
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.4.10903-e5521bd8c@sha256:e0ab27395614a8e1a4fdf84c6bc60ac664915cfdde70c52d030c7728a1c48e14
          env:
            - name: ADVERTISE_IP
              value: "http://${vip}:32400,https://plex.${domain}"
            - name: ALLOWED_NETWORKS
              value: "${cidr},${kubeServicesCidr},10.244.0.0/16,10.42.10.0/24"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "${timezone}"
            - name: VERSION
              value: "docker"
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  key: plex-claim
                  name: plex-claim
          ports:
            - name: http
              containerPort: 32400
              protocol: TCP
            - name: dnla-tcp
              containerPort: 32469
              protocol: TCP
            - name: dnla-udp
              containerPort: 1900
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            # - mountPath: /etc/services.d/plex/run
            #   name: s6-plex
            #   subPath: s6-plex.sh
            - mountPath: /usr/lib/plexmediaserver/Resources/Profiles/Chromecast.xml
              name: chromecast
              subPath: Chromecast.xml
            - name: transcode
              mountPath: /plex/tmp
            - name: movies
              mountPath: /data/movies
            - name: tvshows
              mountPath: /data/tvshows
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /identity
              port: http
          resources:
            limits:
              memory: 4096Mi
            requests:
              memory: 2048Mi
              cpu: 100m
        - name: vector
          image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --config
            - /etc/vector/vector.yaml
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
          volumeMounts:
          - mountPath: /etc/vector/vector.yaml
            name: vector
            readOnly: true
            subPath: vector.yaml
          - mountPath: /plex/etc
            name: config
            readOnly: true
          - mountPath: /var/lib/vector
            name: work
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: s6-plex
          configMap:
            name: s6-plex
            defaultMode: 0755
        - name: chromecast
          configMap:
            name: chromecast
            defaultMode: 0644
        - name: transcode
          emptyDir:
            sizeLimit: 20Gi
        - name: vector
          configMap:
            name: vector
        - name: work
          emptyDir:
            medium: Memory
        - name: movies
          nfs:
            server: genji.home.arpa
            path: /movies
        - name: tvshows
          nfs:
            server: genji.home.arpa
            path: /tvshows
