---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llamacpp
  annotations:
    dashboard.${domain}/name: llamacpp
    dashboard.${domain}/url: https://llamacpp.${domain}
    dashboard.${domain}/icon: brain
spec:
  hostnames:
  - llamacpp.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: llamacpp
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
