---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  annotations:
    configmap.reloader.stakater.com/reload: "config"
  labels:
    stateful: "true"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: llamacpp
  template:
    metadata:
      labels:
        app: llamacpp
        policy.gatekeeper.sh/ignore-container-must-have-limits: "true"
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: llamacpp
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: llamacpp
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b12723
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            # - --models-dir
            # - /models
            - --models-preset
            - /app/config.ini
            - --models-max
            - "1"
            # Preserve VRAM headroom
            - --models-memory-margin
            - "2048"
            # Enable monitoring
            - --metrics
          env:
            # - name: "NVIDIA_DRIVER_CAPABILITIES"
            #   value: "compute,utility"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: huggingface-token
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 1064Mi
            limits:
              memory: 8192Mi
              nvidia.com/gpu.shared: "1"
              # nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config.ini
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: tmp
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: config
            defaultMode: 0644
      tolerations:
        - key: nvidia
          operator: Exists
          effect: NoSchedule
