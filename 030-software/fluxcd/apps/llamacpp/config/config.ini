
version = 1

; ============================================================
; GLOBAL DEFAULTS
; Tesla P40 24 GB VRAM
; Kubernetes node: 16-32 GB RAM
; Single-user inference
; ============================================================

[*]
flash-attn = on
mmap = true

; Let llama.cpp automatically use available GPU memory
n-gpu-layers = all
fit = on
fit-target = 1536

; Context and concurrency
ctx-size = 8192
parallel = 1
kv-unified = true

; Conservative prompt processing
batch-size = 512
ubatch-size = 128

; KV cache
cache-type-k = f16
cache-type-v = f16

; Sampling defaults
temp = 0.7
top-p = 0.9
top-k = 40
min-p = 0.05

; ============================================================
; GEMMA 4 E4B
; ============================================================

[ggml-org/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q8_K_P]
model = /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf
ctx-size = 8192
batch-size = 1024
ubatch-size = 256

; ============================================================
; LAYA
; ============================================================

[ggml-org/Laya-Q8_0]
model = /models/Laya-Q8_0.gguf
ctx-size = 4096
batch-size = 512
ubatch-size = 128

; ============================================================
; QWEN 3 8B
; ============================================================

[ggml-org/Qwen3-8B-Q8_0]
model = /models/Qwen3-8B-Q8_0.gguf
ctx-size = 8192
batch-size = 1024
ubatch-size = 256

; ============================================================
; QWEN 3.6 35B A3B
; MoE model - memory constrained
; ============================================================

[ggml-org/Qwen3.6-35B-A3B-Q4_K_M]
model = /models/Qwen3.6-35B-A3B-Q4_K_M.gguf
ctx-size = 4096
parallel = 1
batch-size = 512
ubatch-size = 128
cache-type-k = q8_0
cache-type-v = q8_0
fit = on
fit-target = 2048

; ============================================================
; QWEN 3.8 27B
; ============================================================

[ggml-org/Qwen3.8-27B-Q4_K_M]
model = /models/Qwen3.8-27B-Q4_K_M.gguf
ctx-size = 8192
parallel = 1
batch-size = 512
ubatch-size = 128
cache-type-k = q8_0
cache-type-v = q8_0
fit = on
fit-target = 2048

; ============================================================
; LLAVA PHI 3 MINI
