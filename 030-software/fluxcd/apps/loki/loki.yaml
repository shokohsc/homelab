---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: loki
spec:
  interval: ${interval}
  url: oci://ghcr.io/grafana-community/helm-charts/loki
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^18.11.4"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: ${interval}
  chartRef:
    kind: OCIRepository
    name: loki
  values:
    commonLabels: null
    deploymentMode: Monolithic
    gateway:
      route:
        main:
          enabled: true
          parentRefs:
            - name: cilium
              namespace: cilium
          hostnames:
            - loki.${domain}
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512M
        limits:
          cpu: 1000m
          memory: 2048M
      # affinity:
      #   nodeAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #     - weight: 100
      #       preference:
      #         matchExpressions:
      #         - key: kubernetes.io/hostname
      #           operator: NotIn
      #           values:
      #           - zarya
      # extraEnv:
      #   - name: GOMEMLIMIT
      #     valueFrom:
      #       resourceFieldRef:
      #         containerName: loki
      #         resource: limits.memory
      #   - name: GOMAXPROCS
      #     valueFrom:
      #       resourceFieldRef:
      #         containerName: loki
      #         resource: limits.cpu
      # extraEnv:
      #   # Keep a little bit lower than memory limits
      #   - name: GOMEMLIMIT
      #     value: 1950MiB
      persistence:
        size: 1Gi
        # storageClass: temp

    loki:
      auth_enabled: false
      limits_config:
        reject_old_samples_max_age: 12h
        max_cache_freshness_per_query: 2m
        split_queries_by_interval: 15m
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 86400s
      tracing:
        enabled: true

    gateway:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 64M
        limits:
          cpu: 1000m
          memory: 64M

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    test:
      enabled: false
    lokiCanary:
      enabled: false

    sidecar:
      rules:
        enabled: false
