---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: loki
spec:
  interval: ${interval}
  url: oci://ghcr.io/grafana-community/helm-charts/loki
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^18.11.4"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: ${interval}
  dependsOn:
    - name: rustfs
      namespace: rustfs
  chartRef:
    kind: OCIRepository
    name: loki
  valuesFrom:
    - kind: Secret
      name: rustfs-credentials
      valuesKey: accessKeyId
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: rustfs-credentials
      valuesKey: secretAccessKey
      targetPath: loki.storage.s3.secretAccessKey
  values:
    commonLabels:
      stateful: "true"

    deploymentMode: Distributed

    gateway:
      route:
        main:
          enabled: true
          parentRefs:
            - name: cilium
              namespace: cilium
          hostnames:
            - loki.${domain}
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 128Mi
      metrics:
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 64Mi

    ingester:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 512Mi
      zoneAwareReplication:
        enabled: false
      persistence:
        enabled: true
        claims:
          - name: data
            accessModes:
              - ReadWriteOnce
            size: 5Gi

    distributor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    querier:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    queryFrontend:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    queryScheduler:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 128Mi

    indexGateway:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    compactor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    ruler:
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    patternIngester:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
        ring:
          kvstore:
            store: memberlist
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
        s3:
          endpoint: http://rustfs-svc.rustfs.svc.cluster.local:9000
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 86400s
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        reject_old_samples_max_age: 12h
        max_cache_freshness_per_query: 2m
        split_queries_by_interval: 15m
      rulerConfig:
        enable_api: true
      tracing:
        enabled: true

    ignoreMinioDeprecation: true
    minio:
      enabled: false

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    test:
      enabled: false
    lokiCanary:
      enabled: false

    sidecar:
      rules:
        enabled: false
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 64Mi

    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
