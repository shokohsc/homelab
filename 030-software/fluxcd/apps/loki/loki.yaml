---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: loki
spec:
  interval: ${interval}
  url: oci://ghcr.io/grafana-community/helm-charts/loki
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^18.11.4"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: ${interval}
  chartRef:
    kind: OCIRepository
    name: loki
  values:
    commonLabels: null

    deploymentMode: Monolithic

    gateway:
      route:
        main:
          enabled: true
          parentRefs:
            - name: cilium
              namespace: cilium
          hostnames:
            - loki.${domain}
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      metrics:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 64Mi

    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      persistence:
        size: 1Gi

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      storage:
        type: filesystem
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 86400s
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        reject_old_samples_max_age: 12h
        max_cache_freshness_per_query: 2m
        split_queries_by_interval: 15m
      rulerConfig:
        enable_api: true
      tracing:
        enabled: true

    ignoreMinioDeprecation: true
    minio:
      enabled: false

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    test:
      enabled: false
    lokiCanary:
      enabled: false

    sidecar:
      rules:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi

    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
