    # loki:
    #   auth_enabled: false
    #   limits_config:
    #     reject_old_samples_max_age: 12h
    #     max_cache_freshness_per_query: 2m
    #     split_queries_by_interval: 15m
    #   commonConfig:
    #     replication_factor: 1
    #   storage:
    #     type: filesystem
    #   schemaConfig:
    #     configs:
    #       - from: "2024-04-01"
    #         store: tsdb
    #         object_store: filesystem
    #         schema: v13
    #         index:
    #           prefix: loki_index_
    #           period: 86400s
    #   tracing:
    #     enabled: true

    # chunksCache:
    #   enabled: false
    # resultsCache:
    #   enabled: false

    # test:
    #   enabled: false
    # lokiCanary:
    #   enabled: false

    # sidecar:
    #   rules:
    #     enabled: false

    gateway:
      route:
        main:
          enabled: true
          parentRefs:
            - name: cilium
              namespace: cilium
          hostnames:
            - loki.${domain}
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
    loki:
      commonConfig:
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
          type: filesystem
          filesystem:
            chunks_directory: /tmp/loki/chunks
            rules_directory: /tmp/loki/rules
      storage:
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 86400s
      # schemaConfig:
      #   configs:
      #     - from: "2024-04-01"
      #       store: tsdb
      #       object_store: s3
      #       schema: v13
      #       index:
      #         prefix: loki_index_
      #         period: 24h
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
      rulerConfig:
        enable_api: true

    ignoreMinioDeprecation: true  # Temporary workaround – MinIO will be removed 2026-10-31
    minio:
      enabled: false
          
    deploymentMode: Monolithic

    singleBinary:
      replicas: 1
      persistence:
        size: 1Gi

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0