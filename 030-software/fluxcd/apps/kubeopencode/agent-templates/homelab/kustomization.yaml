apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      group: kubeopencode.io
      version: v1alpha1
      kind: AgentTemplate
      name: opencode
    patch: |-
      - op: replace
        path: /metadata/name
        value: homelab
      - op: replace
        path: /spec/contexts/0/text
        value: |
          You're running inside a container's pod in a talos cluster with a strict pod security policy, 
          means read only root filesystem, non root user, user with 1000 uid and gid.
          Available workspace is at /workspace.
          No container runtime is available so no docker commands.
          Add changes as a pull request to the homelab repo.
      - op: add
        path: /spec/contexts/-
        value:
          name: homelab-repo
          type: Git
          git:
            repository: https://github.com/shokohsc/homelab.git
            ref: main
          mountPath: homelab/