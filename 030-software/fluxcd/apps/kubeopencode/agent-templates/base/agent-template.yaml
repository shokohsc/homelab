---
# Shared base for every AgentTemplate. Overlays rename it and append their own
# contexts - see ../*/kustomization.yaml. Do not add per-agent fields here.
apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: opencode
spec:
  agentImage: shokohsc/kubeopencode-agent-opencode:v0.1.9@sha256:e6875f86aaab85cc6a8a94c3d1d4d5d1668c1e7865a71cdc978d553ac872ed62
  executorImage: ghcr.io/kubeopencode/kubeopencode-agent-devbox:latest
  attachImage: ghcr.io/kubeopencode/kubeopencode-agent-attach:latest
  workspaceDir: /workspace
  serviceAccountName: kubeopencode-agent

  contexts:
    - name: main
      type: Text
      text: |
        You're running inside a container's pod in a talos cluster with a strict pod security policy, 
        means read only root filesystem, non root user, user with 1000 uid and gid.
        Available workspace is at /workspace.
        No container runtime is available so no docker commands.
        Remove unused code.
        You can authenticate to github with the personnal access token from the GITHUB_TOKEN environment variable.
    - name: platform-info
      type: Runtime

  credentials:
    - name: github-token
      secretRef:
        name: credentials
        key: token
      env: GITHUB_TOKEN

  skills:
    - name: homelab-skills
      git:
        repository: https://github.com/shokohsc/homelab.git
        ref: main
        path: 030-software/fluxcd/apps/kubeopencode/skills/
        names:
          - kubernetes
          - golang
          - javascript
          - self-improve
          - devops
    - name: anthropic-skills
      git:
        repository: https://github.com/anthropics/skills.git
        ref: main
        path: skills/
        names:
          - frontend-design
          - skill-creator
          - webapp-testing

  plugins:
    - name: cc-safety-net
    - name: opencode-database-plugin
    - name: "@dietrichgebert/ponytail"
    - name: opencode-helicone-session
    - name: "@tarquinen/opencode-dcp"
    - name: opencode-pty
    # - name: "@nicholasgriffintn/opencode-plugin-otel"
    #   options:
    #     endpoint: "http://otel-collector:4318"

  config:
    $schema: https://opencode.ai/config.json
    # model: opencode/big-pickle
    model: nvidia_custom/deepseek-ai/deepseek-v4.1-flash
    # model: nvidia_custom/z-ai/glm-5.3-flash
    # model: nvidia_custom/nvidia/nemotron-3.5-super-vl-120b-a12b
    # model: opencode/deepseek-v4.1-flash
    provider:
      nvidia_custom:
        npm: "@ai-sdk/openai-compatible"
        name: nvidia_custom
        env:
          - NVIDIA_API_KEY
        options:
          baseURL: "https://integrate.api.nvidia.com/v1"
        models:
          deepseek-ai/deepseek-v4.1-flash:
            name: deepseek-ai/deepseek-v4.1-flash
          z-ai/glm-5.3-flash:
            name: z-ai/glm-5.3-flash
          nvidia/nemotron-3.5-super-vl-120b-a12b:
            name: nvidia/nemotron-3.5-super-vl-120b-a12b
      llama.cpp:
        npm: "@ai-sdk/openai-compatible"
        name: "llama CPP (local)"
        options:
          baseURL: "http://llama-cpp.${domain}:11434/v1"
        models:
          dealignai/Ornith-1.5-9B-UNCENSORED-GGUF:Q4_K_M:
            name: dealignai/Ornith-1.5-9B-UNCENSORED-GGUF:Q4_K_M
          ggml-org/gemma-4-E4B-it-GGUF:Q4_0:
            name: ggml-org/gemma-4-E4B-it-GGUF:Q4_0
          ggml-org/gpt-oss-20b-GGUF:MXFP4:
            name: ggml-org/gpt-oss-20b-GGUF:MXFP4
          unsloth/Qwen3.8-27B-GGUF:Q4_K_M:
            name: unsloth/Qwen3.8-27B-GGUF:Q4_K_M
  # configRef:
  #   configMapRef:
  #     name: config

  caBundle:
    configMapRef:
      name: homelab-ca-cm
      key: ca-certs.pem

  # proxy:
  #   httpProxy: "http://proxy.corp.example.com:8080"
  #   httpsProxy: "http://proxy.corp.example.com:8080"
  #   noProxy: "localhost,127.0.0.1,.svc,.cluster.local"

  podSpec:
    labels:
      policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
      policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
      policy.gatekeeper.sh/ignore-container-must-have-limits: "true"
      getkloak.io/enabled: "true"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    extraEnv:
      - name: OPENCODE_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: credentials
            key: postgres-url
      - name: NVIDIA_API_KEY
        valueFrom:
          secretKeyRef:
            name: credentials
            key: nvidia-api-key
    extraVolumes:
      - name: temp
        emptyDir: {}
      - name: home
        emptyDir: {}
    extraVolumeMounts:
      - name: temp
        mountPath: /tmp
      - name: home
        mountPath: /home/agent

  maxConcurrentTasks: 5
  quota:
    maxTaskStarts: 20
    windowSeconds: 3600