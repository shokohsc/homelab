apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace
resources:
  - namespace.yaml
  - secret.yaml
  - rbac.yaml
  - agent-templates
  - agents
  - cilium-network-policy.yaml
configMapGenerator:
- name: config
  files:
  - ./config/opencode.json
generatorOptions:
  disableNameSuffixHash: true