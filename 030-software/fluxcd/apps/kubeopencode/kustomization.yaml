apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace
resources:
  - namespace.yaml
  - secret.yaml
  - rbac.yaml
  - agent-templates/main.yaml
  - agent-templates/homelab.yaml
  - agent-templates/talos-proxmox-autoscaler.yaml
  - agent.yaml
  - cilium-network-policy.yaml
configMapGenerator:
- name: config
  files:
  - ./config/opencode.json