apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      group: kubeopencode.io
      version: v1alpha1
      kind: Agent
      name: agent
    patch: |-
      - op: replace
        path: /metadata/name
        value: main
      - op: add
        path: /spec/templateRef
        value:
          name: main
      - op: add
        path: /spec/share/enabled
        value: true
      - op: replace
        path: /spec/share/allowedIPs
        value:
          - 10.42.10.0/24
          - 10.244.0.0/16