---
apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: main
spec:
  templateRef:
    name: main
  profile: "Homelab Devops specialist"
  plugins:
    - name: "superpowers@git+https://github.com/obra/superpowers.git"
      target: tui
  share:
    enabled: true
    allowedIPs:
      - 10.42.10.0/24
      - 10.244.0.0/16
---
apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: homelab
spec:
  templateRef:
    name: main
  profile: "Homelab Repository agent"
  contexts:
    - name: main
      type: Text
      text: |
        You're running inside a container's pod in a talos cluster with a strict pod security policy, 
        means read only root filesystem, non root user, user with 1000 uid and gid.
        Available workspace is at /workspace.
        No container runtime is available so no docker commands.
    - name: platform-info
      type: Runtime
    - name: homelab-repo
      type: Git
      git:
        repository: https://github.com/shokohsc/homelab.git
        ref: main
      mountPath: homelab/
---
apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: talos-proxmox-autoscaler
spec:
  templateRef:
    name: main
  profile: "Talos Proxmox Autoscaler Repository agent"
  contexts:
    - name: main
      type: Text
      text: |
        You're running inside a container's pod in a talos cluster with a strict pod security policy, 
        means read only root filesystem, non root user, user with 1000 uid and gid.
        Available workspace is at /workspace.
        No container runtime is available so no docker commands.
    - name: platform-info
      type: Runtime
    - name: talos-proxmox-autoscaler-repo
      type: Git
      git:
        repository: https://github.com/shokohsc/talos-proxmox-autoscaler.git
        ref: main
      mountPath: talos-proxmox-autoscaler/