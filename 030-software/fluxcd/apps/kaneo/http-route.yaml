---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kaneo
  annotations:
    dashboard.${domain}/icon: kanban
    dashboard.${domain}/name: kaneo
    dashboard.${domain}/url: https://kaneo.${domain}
spec:
  hostnames:
  - kaneo.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: kaneo
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
