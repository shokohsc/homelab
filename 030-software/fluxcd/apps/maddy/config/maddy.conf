## Maddy Mail Server - default configuration file (2021-08-16)
# Suitable for small-scale deployments. Uses its own format for local users DB,
# should be managed via maddyctl utility.
#
# See tutorials at https://maddy.email for guidance on typical
# configuration changes.
#
# See manual pages (also available at https://maddy.email) for reference
# documentation.

# ----------------------------------------------------------------------------
# Base variables

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)
$(alias_file) = /config/aliases

# ----------------------------------------------------------------------------
# Persistency path

state_dir /data

# ----------------------------------------------------------------------------
# TLS server certs (IMAP and SMTP)

# tls file /certificates/tls.crt /certificates/tls.key

# ----------------------------------------------------------------------------
# Open Metrics

openmetrics tcp://0.0.0.0:9749 { }


# ----------------------------------------------------------------------------
# Debug

debug no

# ----------------------------------------------------------------------------
# Local storage & authentication

# pass_table provides local hashed passwords storage for authentication of
# users. It can be configured to use any "table" module, in default
# configuration a table in SQLite DB is used.
# Table can be replaced to use e.g. a file for passwords. Or pass_table module
# can be replaced altogether to use some external source of credentials (e.g.
# PAM, /etc/shadow file).
#
# If table module supports it (sql_table does) - credentials can be managed
# using 'maddyctl creds' command.

auth.pass_table local_authdb {
    table sql_table {
        driver postgres
        dsn "dbname='{env:DB_NAME}' host='{env:DB_HOST}' password='{env:DB_PASSWORD}' sslmode='disable' user='{env:DB_USER}'"
        table_name passwords
    }
}

# imapsql module stores all indexes and metadata necessary for IMAP using a
# relational database. It is used by IMAP endpoint for mailbox access and
# also by SMTP & Submission endpoints for delivery of local messages.
#
# IMAP accounts, mailboxes and all message metadata can be inspected using
# imap-* subcommands of maddyctl utility.

storage.imapsql local_mailboxes {
    driver postgres
    dsn "dbname='{env:DB_NAME}' host='{env:DB_HOST}' password='{env:DB_PASSWORD}' sslmode='disable' user='{env:DB_USER}'"
    # Other settings
    imap_filter {
      command /etc/maddy/mailbox.sh {account_name} {original_rcpt_to}
   }
}

# ----------------------------------------------------------------------------
# SMTP endpoints + message routing

hostname $(hostname)


# Local address rewriting
table.chain local_rewrites {
    optional_step static {
        entry postmaster postmaster@$(primary_domain)
    }

    # Delimiter-address rewriting
    optional_step regexp "(.+)[\+\.](.+)@(.+)" "$1@$3"

    step identity
}

# Local address catchall
table.chain catchall_rewrites {
    # Catchall rewriting
    step regexp ".*" "catchall@$(primary_domain)"
}

# Allowed sending aliases
#   "domain" for any address at specified domain
#   "*" for any address at all
#   "email@domain" for specific alternate address
table.chain domain_alias {
    step regexp "(.+)@(.+)" "$2"
}

msgpipeline local_routing {
    modify {
        replace_rcpt &local_rewrites
    }

    destination_in &local_mailboxes {
        deliver_to &local_mailboxes
    }

    destination $(local_domains) {
        modify {
            replace_rcpt &catchall_rewrites
        }

        deliver_to &local_mailboxes
    }

    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

smtp tcp://0.0.0.0:25 {
    hostname $(hostname)

    tls file /certificates/smtp/tls.crt /certificates/smtp/tls.key

    limits {
        # Up to 20 msgs/sec across max. 10 SMTP connections.
        all rate 20 1s
        all concurrency 10
    }

    dmarc yes
    check {
        require_mx_record {
            debug yes
        }
        require_matching_rdns {
            debug yes
            fail_action ignore
        }
        require_tls {
            debug yes
            fail_action quarantine
        }
        dkim
        spf {
            fail_action ignore
            permerr_action quarantine
            temperr_action quarantine
        }
        command /etc/maddy/alias-filter.sh {address} {sender} {source_ip} {source_host} {source_rdns} {
            run_on rcpt
            code 2 quarantine
            code 1 reject 550 5.1.1 "Go to jail, go directly to jail, do not collect 200$."
            code 0 ignore
        }
        dnsbl {
            debug yes
            check_early no

            quarantine_threshold 1
            reject_threshold 1

            # Lists configuration example.
            bl.0spam.org {
                client_ipv4 yes
                client_ipv6 no
                ehlo no
                mailfrom no
                score 1
            }
            # hsrbl.example.org {
            #     client_ipv4 no
            #     client_ipv6 no
            #     ehlo yes
            #     mailfrom yes
            #     score 1
            # }
        }
    }

    source $(local_domains) {
        reject 501 5.1.8 "Use Submission for outgoing SMTP"
    }

    default_source {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }
}


# Outgoing email

submission tls://0.0.0.0:465 tcp://0.0.0.0:587 {
    tls file /certificates/imap/tls.crt /certificates/imap/tls.key

    limits {
        # Up to 50 msgs/sec across any amount of SMTP connections.
        all rate 50 1s
    }

    auth &local_authdb

    source $(local_domains) {
        check {
            authorize_sender {
                prepare_email &local_rewrites
                user_to_email &domain_alias
            }
        }

        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            modify {
                dkim {
                    domains $(primary_domain) $(local_domains)
                    selector maddy
                    key_path /dkim/dkim_maddy.key
                }
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

# Using a smtp relay
target.smtp outbound_delivery {
    require_tls
    auth plain {env:RELAY_USERNAME} {env:RELAY_PASSWORD}
    targets tcp://{env:RELAY_HOST}:{env:RELAY_PORT}
}

# target.remote outbound_delivery {
