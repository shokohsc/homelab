---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: post-account
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/displayName: post-account
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Idempotently creates a maddy account.
  params:
    - name: ACCOUNT
      type: string
      description: the account name, i.e test
    - name: PASSWORD
      type: string
      description: the account password, i.e not 12345
    - name: MADDY_DOMAIN
      type: string
      description: the domain name, i.e example.com
  steps:
    - name: kubectl
      image: public.ecr.aws/bitnami/kubectl:1.36.1
      resources:
        requests:
          cpu: 10m
          memory: 64M
        limits:
          cpu: 100m
          memory: 64M
      script: |
        #!/bin/bash
        kubectl exec -n maddy deploy/maddy -c maddy '--' maddy --config /config/maddy.conf creds create --password "$(params.PASSWORD)" "$(params.ACCOUNT)@$(params.MADDY_DOMAIN)"
        kubectl exec -n maddy deploy/maddy -c maddy '--' maddy --config /config/maddy.conf imap-acct create "$(params.ACCOUNT)@$(params.MADDY_DOMAIN)"
        exit 0
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: delete-account
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/displayName: delete-account
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Idempotently removes a maddy account.
  params:
    - name: ACCOUNT
      type: string
      description: the account name, i.e test
    - name: MADDY_DOMAIN
      type: string
      description: the domain name, i.e example.com
  steps:
    - name: kubectl
      image: public.ecr.aws/bitnami/kubectl:1.36.1
      resources:
        requests:
          cpu: 10m
          memory: 64M
        limits:
          cpu: 100m
          memory: 64M
      script: |
        #!/bin/bash
        kubectl exec -n maddy deploy/maddy -c maddy '--' maddy --config /config/maddy.conf imap-acct remove --yes "$(params.ACCOUNT)@$(params.MADDY_DOMAIN)"
        kubectl exec -n maddy deploy/maddy -c maddy '--' maddy --config /config/maddy.conf creds remove --yes "$(params.ACCOUNT)@$(params.MADDY_DOMAIN)"
        exit 0
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: list-account
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/displayName: list-account
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Lists maddy accounts.
  steps:
    - name: kubectl
      image: public.ecr.aws/bitnami/kubectl:1.36.1
      resources:
        requests:
          cpu: 10m
          memory: 64M
        limits:
          cpu: 100m
          memory: 64M
      script: |
        #!/bin/bash
        kubectl exec -n maddy deploy/maddy -c maddy '--' maddy --config /config/maddy.conf creds list
        kubectl exec -n maddy deploy/maddy -c maddy '--' maddy --config /config/maddy.conf imap-acct list
        exit 0
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: post-accounts
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/displayName: post-accounts
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Initializes accounts & mailboxes.
  params:
    - name: PASSWORD
      type: string
      description: The accounts password
    - name: MADDY_DOMAIN
      type: string
      description: The accounts domain
  tasks:
    - name: post-account-postmaster
      taskRef:
        name: post-account
      params:
        - name: ACCOUNT
          value: postmaster
        - name: PASSWORD
          value: $(params.PASSWORD)
        - name: MADDY_DOMAIN
          value: $(params.MADDY_DOMAIN)

    - name: post-account-catchall
      taskRef:
        name: post-account
      params:
        - name: ACCOUNT
          value: catchall
        - name: PASSWORD
          value: $(params.PASSWORD)
        - name: MADDY_DOMAIN
          value: $(params.MADDY_DOMAIN)

---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: delete-accounts
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/displayName: delete-accounts
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Deletes accounts & mailboxes.
  params:
    - name: MADDY_DOMAIN
      type: string
      description: The accounts domain
  tasks:
    - name: delete-account-postmaster
      taskRef:
        name: delete-account
      params:
        - name: ACCOUNT
          value: postmaster
        - name: MADDY_DOMAIN
          value: $(params.MADDY_DOMAIN)

    - name: delete-account-catchall
      taskRef:
        name: delete-account
      params:
        - name: ACCOUNT
          value: catchall
        - name: MADDY_DOMAIN
          value: $(params.MADDY_DOMAIN)
---
