apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: restore
spec:
  description: >-
    Restores data from nfs-shared.
  params:
  - name: backup_file
  steps:
  - name: backup
    image: offen/docker-volume-backup:v2.48.2@sha256:19102d8e59eb1d598cf8c647c2b21100abaadc5a1c808ac643fa612e323c3013
    script: |
      #!/usr/bin/env sh
      set -eu
      rm -rf /data/*
      tar -C /data --strip-components=2 -xvzf "/archive/$(params.backup_file)"
    volumeMounts:
      - name: data
        mountPath: /data
      - name: shared
        mountPath: /archive
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
    - name: shared
      nfs:
        server: nfs-shared.nfs-shared.svc.cluster.local
        path: /backups/maddy
