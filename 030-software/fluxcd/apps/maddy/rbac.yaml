---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maddy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maddy:maddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maddy:maddy
subjects:
  - kind: ServiceAccount
    namespace: maddy
    name: maddy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maddy:maddy
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
