---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-crt
  labels:
    challenge: dns01
spec:
  secretName: smtp-crt
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames: ["${publicDomain}"]
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: imap-crt
spec:
  secretName: imap-crt
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames: ["maddy.${domain}"]
  issuerRef:
    name: ca-cluster-issuer
    kind: ClusterIssuer
