---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sign-pdf
  annotations:
    dashboard.${domain}/name: sign-pdf
    dashboard.${domain}/url: https://sign-pdf.${domain}
    dashboard.${domain}/icon: file-pdf-box
spec:
  hostnames:
  - sign-pdf.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: sign-pdf
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
