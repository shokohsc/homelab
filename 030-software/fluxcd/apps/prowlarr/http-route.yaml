---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  annotations:
    dashboard.${domain}/icon: paw
    dashboard.${domain}/name: prowlarr
    dashboard.${domain}/url: https://prowlarr.${domain}
spec:
  hostnames:
  - prowlarr.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: prowlarr
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
