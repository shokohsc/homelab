---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-platform
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: cnpg-platform
  template:
    metadata:
      labels:
        app: cnpg-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: "kubernetes.io/hostname"
                labelSelector:
                  matchLabels:
                    app: cnpg-platform
      serviceAccountName: cnpg-platform
      containers:
        - name: cnpg-platform
          image: ghcr.io/shokohsc/cnpg-platform:0b89677
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - --port=8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              port: http
              path: /healthz
          livenessProbe:
            tcpSocket:
              port: http
          startupProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
