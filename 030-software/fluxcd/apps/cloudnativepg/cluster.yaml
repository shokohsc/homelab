apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: instancez
spec:
  instances: 3
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: instancez
      owner: instancez
  postgresql:
    parameters:
      max_connections: "200"
