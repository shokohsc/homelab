apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lidarr-main
spec:
  name: lidarr-main
  owner: lidarr
  cluster:
    name: main
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lidarr-logs
spec:
  name: lidarr-logs
  owner: lidarr
  cluster:
    name: main
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: lidarr
spec:
  cluster:
    name: main
  name: lidarr
  login: true
  superuser: false
  createdb: false
  createrole: false
  passwordSecret:
    name: lidarr
