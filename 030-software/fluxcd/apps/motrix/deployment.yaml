---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motrix
  labels:
    stateful: "true"
    nfs-downloads: "true"
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: motrix
  template:
    metadata:
      labels:
        app: motrix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: motrix
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: motrix
      containers:
        - name: motrix
          image: ghcr.io/agalwood/motrix-server:2.0.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MOTRIX_PUBLIC_URL
              value: motrix.${domain}
            - name: MOTRIX_MDXP_HOST
              value: 0.0.0.0
            - name: MOTRIX_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                    name: motrix
                    key: operator-token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: downloads
              mountPath: /downloads
            - name: temp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 2048Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: downloads
          nfs:
            server: ${nfsDownloadsServer}
            path: /motrix
        - name: temp
          emptyDir: {}
