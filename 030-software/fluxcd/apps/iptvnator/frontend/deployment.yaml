---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iptvnator
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: iptvnator
  template:
    metadata:
      labels:
        app: iptvnator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iptvnator
          image: 4gray/iptvnator:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: BACKEND_URL
              value: https://api.iptvnator.${domain}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/http.d
      volumes:
        - name: conf
          emptyDir:
            medium: Memory