---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: localai
  annotations:
    dashboard.${domain}/name: localai
    dashboard.${domain}/url: https://localai.${domain}
    dashboard.${domain}/icon: brain
spec:
  hostnames:
  - localai.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: localai
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
