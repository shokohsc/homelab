---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaniko
secrets:
- name: kaniko-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaniko-el-roles
subjects:
- kind: ServiceAccount
  name: kaniko
  namespace: kaniko
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaniko-el-clusterroles
subjects:
- kind: ServiceAccount
  name: kaniko
  namespace: kaniko
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
