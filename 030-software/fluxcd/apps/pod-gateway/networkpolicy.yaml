apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-gateway
spec:
  podSelector:
    matchLabels:
      app: pod-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              namespace: sidekick
          podSelector:
            matchLabels:
              app: api
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
