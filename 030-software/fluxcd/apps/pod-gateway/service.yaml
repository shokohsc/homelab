---
apiVersion: v1
kind: Service
metadata:
  name: pod-gateway
  labels:
    app: pod-gateway
  annotations:
spec:
  type: ClusterIP
  ports:
  - port: 67
    targetPort: dhcp
    protocol: UDP
    name: dhcp
  - port: 8472
    targetPort: foo
    protocol: UDP
    name: foo
  # - port: 9091
  #   targetPort: vector
  #   protocol: TCP
  #   name: vector
  selector:
    app: pod-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: pod-gateway-webhook
  labels:
    app: pod-gateway-webhook
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  selector:
    app: pod-gateway-webhook
