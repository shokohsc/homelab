---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openchamber
  annotations:
    dashboard.${domain}/name: openchamber
    dashboard.${domain}/url: https://openchamber.${domain}
    dashboard.${domain}/icon: robot
spec:
  hostnames:
  - openchamber.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: openchamber
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
