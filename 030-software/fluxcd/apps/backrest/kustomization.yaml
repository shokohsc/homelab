apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backrest
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - pvc.yaml

  - rbac.yaml
  - cronjob.yaml
configMapGenerator:
- name: scripts
  files:
  - ./config/backup.sh
generatorOptions:
  disableNameSuffixHash: true