apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep
spec:
  endpointSelector: {}
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: karakeep
        - matchLabels:
            io.kubernetes.pod.namespace: browserless
        - matchLabels:
            io.kubernetes.pod.namespace: meilisearch
        - matchLabels:
            io.kubernetes.pod.namespace: llamacpp
    - toEntities:
        - world
