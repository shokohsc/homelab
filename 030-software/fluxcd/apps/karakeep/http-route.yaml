---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karakeep
  annotations:
    dashboard.${domain}/name: karakeep
    dashboard.${domain}/url: https://karakeep.${domain}
    dashboard.${domain}/icon: bookmark
spec:
  hostnames:
  - karakeep.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: karakeep
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
