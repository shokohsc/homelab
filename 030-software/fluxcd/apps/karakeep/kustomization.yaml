apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: karakeep
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - pvc.yaml
  # - cronjob.yaml
  - secret.yaml
  - cilium-network-policy.yaml
configMapGenerator:
- name: scripts
  files:
    - ./scripts/backup-bookmarks-and-lists.sh
    - ./scripts/backup-bookmarks.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled