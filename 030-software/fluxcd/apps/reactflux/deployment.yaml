---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactflux
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: reactflux
  template:
    metadata:
      labels:
        app: reactflux
        policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        # runAsNonRoot: true
        # runAsUser: 1000
        # runAsGroup: 1000
        # fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reactflux
          image: electh/reactflux:2025-08-19
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 2000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
