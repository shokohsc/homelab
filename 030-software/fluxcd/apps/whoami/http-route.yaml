---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  annotations:
    dashboard.${domain}/name: whoami
    dashboard.${domain}/url: https://whoami.${domain}
    dashboard.${domain}/icon: bullseye
spec:
  hostnames:
  - whoami.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: whoami
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
