---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wekan
  annotations:
    dashboard.${domain}/icon: trello
    dashboard.${domain}/name: wekan
    dashboard.${domain}/url: https://wekan.${domain}
spec:
  hostnames:
  - wekan.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: wekan
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
