apiVersion: v1
kind: Secret
metadata:
  name: nostr-gateway
type: Opaque
# TODO(operator): replace every placeholder, then encrypt this file before committing:
#   sops --encrypt --in-place 030-software/fluxcd/apps/nostr-gateway/secret.yaml
# See README.md in this directory for how to produce the values. The Nostr private key
# must never be committed in plaintext.
stringData:
  # The agent's Nostr identity. Either form is accepted, hex or nsec1..., and the
  # matching npub1... goes in config/agents.json under the same agent name.
  MAIN_NSEC: "REPLACE_ME_agent_nostr_secret_key"
  # Bearer token for the plain-HTTP API. The deployment is ClusterIP only; this is
  # what stops anything on the pod network from driving the agent.
  #   openssl rand -hex 32
  GATEWAY_TOKEN: "REPLACE_ME_openssl_rand_hex_32"
