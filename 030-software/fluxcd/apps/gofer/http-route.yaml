---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gofer
  annotations:
    dashboard.${domain}/name: gofer
    dashboard.${domain}/url: https://gofer.${domain}
    dashboard.${domain}/icon: email
spec:
  hostnames:
  - gofer.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: gofer
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
