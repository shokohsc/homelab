---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gofer
spec:
  hostnames:
  - gofer.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: gofer
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
