---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gofer
spec:
  interval: ${interval}
  url: oci://ghcr.io/cristianadrielbraun/charts/gofer
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^0.1.2"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gofer
spec:
  interval: ${interval}
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: gofer
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                replicas: null
                revisionHistoryLimit: 0
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/name=gofer
  valuesFrom:
    - kind: Secret
      name: gofer-secrets
      valuesKey: secret.existingSecret
      targetPath: GOFER_SECRET_KEY
  values:
    serviceAccount:
      create: false

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

    config:
      baseUrl: https://gofer.${domain}
      authMode: open
      timezone: ${timezone}
      # # CIDRs of the ingress/proxy, so the real client IP is honored.
      # trustedProxyCidrs: ""
      # # Optional allowlist of client networks (GOFER_ALLOWED_CIDRS).
      # allowedCidrs: ""
      # allowInsecureLan: false
      # # Extra non-secret GOFER_* variables.
      # extraEnv: {}

    persistence:
      enabled: true
      size: 100Mi

    httpRoute:
      enabled: true
      annotations:
        dashboard.${domain}/name: gofer
        dashboard.${domain}/url: https://gofer.${domain}
        dashboard.${domain}/icon: email
      parentRefs:
        - name: cilium
          namespace: cilium
      hostnames:
        - gofer.${domain}

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 1024Mi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: gofer