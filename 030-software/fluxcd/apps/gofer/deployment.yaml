---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gofer
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: gofer
  template:
    metadata:
      labels:
        app: gofer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: gofer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gofer
      containers:
        - name: gofer
          image: ghcr.io/cristianadrielbraun/gofer:0.15.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GO_ENV
              value: production
            - name: GOFER_ADDR
              value: 0.0.0.0:8090
            - name: GOFER_ALLOWED_CIDRS
              value: ${kubePodsCidr}
            - name: GOFER_AUTH_MODE
              value: open
            - name: GOFER_BASE_URL
              value: https://gofer.${domain}
            - name: GOFER_DB_PATH
              value: /data/gofer.db
            - name: GOFER_TRUSTED_PROXY_CIDRS
              value: ${kubeServicesCidr}
            - name: TZ
              value: Europe/Paris
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 1024Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /tmp
            - mountPath: /etc/ssl/certs
              name: tls
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: temp
          emptyDir: {}
        - name: tls
          configMap:
            name: homelab-ca-cm
            defaultMode: 0600
