---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nosterm
  annotations:
    configmap.reloader.stakater.com/reload: config
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: nosterm
  template:
    metadata:
      labels:
        app: nosterm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nosterm
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nosterm
      containers:
        - name: nosterm
          image: public.ecr.aws/k3k1z1x5/nosterm:latest@sha256:8f52832f290d76a511f844cf7b5177fe1a2b808255f8df65381afb89abc09f42
          imagePullPolicy: Always
          # The image entrypoint only regenerates /srv/config.json from env;
          # the relay list ships as a ConfigMap instead, so skip the entrypoint.
          command:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /srv/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /data/caddy
            - name: data
              mountPath: /config/caddy
      volumes:
        - name: config
          configMap:
            name: config
            defaultMode: 0644
        - name: data
          emptyDir: {}
