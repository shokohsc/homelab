---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nosterm
  annotations:
    dashboard.${domain}/name: nosterm
    dashboard.${domain}/url: https://nosterm.${domain}
    dashboard.${domain}/icon: slack
spec:
  hostnames:
  - nosterm.${domain}
  parentRefs:
  - name: cilium
    namespace: cilium
  rules:
  - backendRefs:
    - name: nosterm
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
