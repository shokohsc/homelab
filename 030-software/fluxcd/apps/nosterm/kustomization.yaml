apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nosterm
resources:
  - cilium-network-policy.yaml
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
configMapGenerator:
  - name: config
    files:
      - ./config/config.json
generatorOptions:
  disableNameSuffixHash: true
