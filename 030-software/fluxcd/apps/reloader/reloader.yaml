---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: reloader
spec:
  interval: ${interval}
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: ${interval}
  chart:
    spec:
      chart: reloader
      version: 2.2.12
      sourceRef:
        kind: HelmRepository
        name: reloader
      interval: ${interval}
  values:
    reloader:
      ignoreJobs: true
      ignoreCronJobs: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64M
          limits:
            cpu: 100m
            memory: 128M
        tolerations:
          - key: "node.kubernetes.io/nuc"
            operator: "Exists"
            effect: "NoSchedule"
