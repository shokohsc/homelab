apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: requirements
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./030-software/fluxcd/crds
  wait: true
  prune: true
  postBuild:
    substitute:
      domain: "home.arpa"
      publicDomain: "shokohsc.com"
      vip: "10.42.60.2"
      cidr: "10.42.60.0/24"
      subnet: "10.42.60"
      gateway: "10.42.60.1"
      kubeServicesCidr: "10.96.0.0/12"
      kubeDns: "10.96.0.10"
      talosSubnet: "10.42.20"
      interval: 10m
      timezone: Europe/Paris
      pollingInterval: "2"
      cooldownPeriod: "180"
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
