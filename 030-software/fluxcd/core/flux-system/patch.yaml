---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 24h
  ignore: |
    .git/
    .github/
    .sops.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 24h
  postBuild:
    substitute:
      publicDomain: "shokohsc.com"
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg