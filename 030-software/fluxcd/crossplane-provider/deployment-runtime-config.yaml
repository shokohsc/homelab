apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: enable-psa
spec:
  deploymentTemplate:
    spec:
      revisionHistoryLimit: 0
      selector: {}
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # affinity:
          #   podAntiAffinity:
          #     preferredDuringSchedulingIgnoredDuringExecution:
          #       - weight: 100
          #         podAffinityTerm:
          #           topologyKey: kubernetes.io/hostname
          #           labelSelector:
          #             matchLabels:
          #               pkg.crossplane.io/provider: provider-opentofu
          # topologySpreadConstraints:
          #   - maxSkew: 1
          #     topologyKey: kubernetes.io/hostname
          #     whenUnsatisfiable: ScheduleAnyway
          #     labelSelector:
          #       matchLabels:
          #         pkg.crossplane.io/provider: provider-opentofu
          containers:
            - name: package-runtime
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PROXMOX_VE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: root-credentials
                      key: username
                - name: PROXMOX_VE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: root-credentials
                      key: password
              resources:
                requests:
                  cpu: 100m
                limits:
                  memory: 512Mi
              volumeMounts:
                - mountPath: /etc/ssl/certs/ca-certs.pem
                  subPath: ca-certs.pem
                  name: tls
                - mountPath: /tmp
                  name: temp
                - mountPath: /tofu
                  name: work
                - mountPath: /tofu/cache
                  name: cache
          volumes:
            - name: tls
              configMap:
                name: homelab-ca-cm
                defaultMode: 0644
            - name: temp
              emptyDir:
                medium: Memory
            - name: cache
              emptyDir: {}
            - name: work
              emptyDir:
                medium: Memory
          tolerations:
            - effect: NoSchedule
              key: node.kubernetes.io/nuc
              operator: Exists
