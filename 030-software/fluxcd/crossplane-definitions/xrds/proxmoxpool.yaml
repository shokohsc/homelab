apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: proxmoxpools.platform.${publicDomain}
spec:
  scope: Namespaced
  group: platform.${publicDomain}
  names:
    kind: ProxmoxPool
    plural: proxmoxpools
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                pool:
                  type: string
                  description: Proxmox pool identifier
                comment:
                  type: string
                  description: Comment for the pool
              required:
                - pool
            status:
              type: object
              properties:
                pool:
                  type: string
                  description: The Proxmox pool ID
                members:
                  type: string
                  description: Pool members as JSON
