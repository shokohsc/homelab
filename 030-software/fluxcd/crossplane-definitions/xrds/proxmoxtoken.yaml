apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: proxmoxtokens.platform.${publicDomain}
spec:
  scope: Namespaced
  group: platform.${publicDomain}
  names:
    kind: ProxmoxToken
    plural: proxmoxtokens
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                comment:
                  type: string
                  description: Proxmox token comment
                user:
                  type: string
                  description: Proxmox user ID (e.g. crossplane@pve)
                name:
                  type: string
                  description: Proxmox token name (e.g. crossplane)
              required:
                - user
                - name
            status:
              type: object
              properties:
                tokenName:
                  type: string
                  description: The Proxmox token name
