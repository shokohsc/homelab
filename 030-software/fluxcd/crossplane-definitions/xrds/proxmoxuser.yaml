apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: proxmoxusers.platform.${publicDomain}
spec:
  scope: Namespaced
  group: platform.${publicDomain}
  names:
    kind: ProxmoxUser
    plural: proxmoxusers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                comment:
                  type: string
                  description: Proxmox user comment
                user:
                  type: string
                  description: Proxmox user ID (e.g. crossplane@pve)
                passwordSecretRef:
                  type: object
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                    key:
                      type: string
                  required:
                    - namespace
                    - name
                    - key
                  description: Reference to a Kubernetes Secret containing the password
                groups:
                  type: array
                  items:
                    type: string
                  description: Proxmox groups to assign the user to
                aclPath:
                  type: string
                  description: ACL path for the user (default /)
              required:
                - user
                - passwordSecretRef
            status:
              type: object
              properties:
                userId:
                  type: string
                  description: The Proxmox user ID
