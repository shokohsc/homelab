apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: proxmoxidentities.platform.${publicDomain}
spec:
  scope: Namespaced
  group: platform.${publicDomain}
  names:
    kind: ProxmoxIdentity
    plural: proxmoxidentities
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                comment:
                  type: string
                  description: Comment for all Proxmox resources
                user:
                  type: string
                  description: Proxmox user ID (e.g. crossplane@pve)
                passwordSecretRef:
                  type: object
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                    key:
                      type: string
                  required:
                    - namespace
                    - name
                    - key
                  description: Reference to a Kubernetes Secret containing the password
                userGroups:
                  type: array
                  items:
                    type: string
                  description: Proxmox groups to assign the user to
                aclPath:
                  type: string
                  description: ACL path for the user (default /)
                tokenName:
                  type: string
                  description: Proxmox token name (creates token if set)
                groupName:
                  type: string
                  description: Proxmox group name (creates group if set)
                groupPropagate:
                  type: boolean
                  description: Proxmox group propagate property
                roleName:
                  type: string
                  description: Proxmox role name (creates role if set)
                privileges:
                  type: array
                  items:
                    type: string
                  description: List of Proxmox privileges for the role
                groupRoles:
                  type: array
                  items:
                    type: string
                  description: Role names to assign to the group
              required:
                - user
                - passwordSecretRef
            status:
              type: object
              properties:
                userId:
                  type: string
                  description: The Proxmox user ID
                tokenName:
                  type: string
                  description: The Proxmox token name
                groupId:
                  type: string
                  description: The Proxmox group ID
                roleId:
                  type: string
                  description: The Proxmox role ID
