apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: proxmoxusers.platform.shokohsc.com
  labels:
    provider: opentofu
spec:
  mode: Pipeline
  compositeTypeRef:
    apiVersion: platform.shokohsc.com/v1alpha1
    kind: ProxmoxUser
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: user-workspace
            base:
              apiVersion: opentofu.m.upbound.io/v1beta1
              kind: Workspace
              spec:
                forProvider:
                  enableTofuCLILogging: true
                  source: Inline
                  module: |
                    variable "comment" {
                      type = string
                    }
                    variable "user" {
                      type = string
                    }
                    variable "password" {
                      type      = string
                      sensitive = true
                    }
                    variable "groups" {
                      type    = string
                      default = ""
                    }

                    resource "proxmox_virtual_environment_user" "this" {
                      comment = var.comment
                      user_id  = var.user
                      enabled = true
                      password = var.password
                      groups   = var.groups != "" ? split(",", var.groups) : null
                    }

                    output "user_id" {
                      value = proxmox_virtual_environment_user.this.user_id
                    }
                  vars:
                    - key: comment
                      value: "Managed by Crossplane"
                    - key: user
                      value: ""
                    - key: groups
                      value: ""
                  env:
                    - name: TF_VAR_password
                      secretKeyRef:
                        name: ""
                        key: ""
                providerConfigRef:
                  name: proxmox
                  kind: ProviderConfig
                writeConnectionSecretToRef:
                  name: opentofu-user-workspace
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.comment
                toFieldPath: spec.forProvider.vars[0].value
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.user
                toFieldPath: spec.forProvider.vars[1].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.groups
                toFieldPath: spec.forProvider.vars[2].value
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: string
                    string:
                      type: Join
                      join:
                        separator: ","
              - type: FromCompositeFieldPath
                fromFieldPath: spec.passwordSecretRef.name
                toFieldPath: spec.forProvider.env[0].secretKeyRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.passwordSecretRef.key
                toFieldPath: spec.forProvider.env[0].secretKeyRef.key
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-user-workspace"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.outputs.user_id
                toFieldPath: status.userId
