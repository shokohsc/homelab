---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gatekeeper
spec:
  interval: ${interval}
  url: https://github.com/open-policy-agent/gatekeeper
  ref:
    tag: v3.22.2
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatekeeper
spec:
  interval: ${interval}
  dependsOn:
    - name: requirements
      namespace: flux-system
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: gatekeeper
  path: ./config/default
  targetNamespace: gatekeeper-system