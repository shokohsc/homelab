---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kloak
spec:
  interval: ${interval}
  url: https://chart.getkloak.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kloak
spec:
  interval: ${interval}
  chart:
    spec:
      chart: kloak
      version: 0.2.0
      sourceRef:
        kind: HelmRepository
        name: kloak
      interval: ${interval}
  values:
    certificates:
      mode: certManager
      certManager:
        issuerRef:
          name: kloak-selfsigned
          kind: Issuer
    dns:
      # Trusted DNS server IPs. Only DNS responses from these servers are used
      # for host-based secret filtering. If empty, auto-discovers kube-dns ClusterIP.
      trustedServers: []
    controller:
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 64Mi