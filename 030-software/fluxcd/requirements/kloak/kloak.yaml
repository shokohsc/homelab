---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kloak
spec:
  interval: ${interval}
  url: https://chart.getkloak.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kloak
spec:
  interval: ${interval}
  maxHistory: 1
  chart:
    spec:
      chart: kloak
      version: 0.2.0
      sourceRef:
        kind: HelmRepository
        name: kloak
      interval: ${interval}
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: all
              spec:
                template:
                  metadata:
                    labels:
                      policy.gatekeeper.sh/ignore: "true"
                  spec:
                    affinity:
                      nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 1
                          preference:
                            matchExpressions:
                            - key: topology.kubernetes.io/region
                              operator: In
                              values:
                              - metal
                    tolerations:
                      - effect: NoSchedule
                        key: node.kubernetes.io/nuc
                        operator: Exists
            target:
              kind: DaemonSet
              labelSelector: app.kubernetes.io/name=kloak
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                revisionHistoryLimit: 0
                template:
                  spec:
                    affinity:
                      nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 1
                          preference:
                            matchExpressions:
                            - key: topology.kubernetes.io/region
                              operator: In
                              values:
                              - metal
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      fsGroup: 1000
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: webhook
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          runAsNonRoot: true
                          capabilities:
                            drop:
                              - ALL
                    tolerations:
                      - effect: NoSchedule
                        key: node.kubernetes.io/nuc
                        operator: Exists
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/name=kloak
  values:
    image:
      tag: dev
    certificates:
      mode: certManager
      certManager:
        issuerRef:
          name: kloak-selfsigned
          kind: Issuer
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 64Mi