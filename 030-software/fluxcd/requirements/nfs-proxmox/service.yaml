---
apiVersion: v1
kind: Service
metadata:
  name: nfs-proxmox
  labels:
    vlan: lb
  annotations:
    lbipam.cilium.io/ips: ${subnet}.50
spec:
  type: LoadBalancer
  ports:
    - port: 2049
      targetPort: nfs
      protocol: TCP
      name: nfs
    - port: 111
      targetPort: rpc-tcp
      protocol: TCP
      name: rpc-tcp
    - port: 111
      targetPort: rpc-udp
      protocol: UDP
      name: rpc-udp
  selector:
    app: nfs-proxmox
