---
apiVersion: v1
kind: Service
metadata:
  name: nfs-proxmox
  labels:
    vlan: lb
  annotations:
    lbipam.cilium.io/ips: ${subnet}.100
spec:
  type: LoadBalancer
  ports:
    - port: 2049
      targetPort: nfs
      protocol: TCP
      name: nfs
    - port: 111
      targetPort: portmapper
      protocol: TCP
      name: portmapper
  selector:
    app: nfs-proxmox
