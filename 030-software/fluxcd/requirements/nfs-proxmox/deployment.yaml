---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backups
  labels:
    app: backups
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: backups
  template:
    metadata:
      labels:
        app: backups
        policy.gatekeeper.sh/ignore: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nfs-server-alpine
          image: itsthenetwork/nfs-server-alpine:latest@sha256:7fa99ae65c23c5af87dd4300e543a86b119ed15ba61422444207efc7abd0ba20 # Find an alpine image that has nfsdcld
          securityContext:
            privileged: true
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpc
              containerPort: 111
              protocol: TCP
          volumeMounts:
            - name: backups
              mountPath: /exports
            # - name: nfsdcld
            #   mountPath: /var/lib/nfs/nfsdcld
          lifecycle:
            postStart:
              exec:
                # command: ["/bin/sh", "-c", "chmod 777 /exports && nfsdcld"]
                command: ["/bin/sh", "-c", "chmod 777 /exports"]
          startupProbe:
            tcpSocket:
              port: nfs
          livenessProbe:
            tcpSocket:
              port: nfs
          readinessProbe:
            tcpSocket:
              port: nfs
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: backups
          hostPath:
            path: /var/mnt/nfs-proxmox-backups
        # - name: nfsdcld
        #   emptyDir:
        #     medium: Memory
      nodeSelector:
        kubernetes.io/hostname: winston
