---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-proxmox
  labels:
    app: nfs-proxmox
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: nfs-proxmox
  template:
    metadata:
      labels:
        app: nfs-proxmox
        policy.gatekeeper.sh/ignore: "true"
    spec:
      securityContext:
        fsGroup: 1000
      automountServiceAccountToken: false
      containers:
        - name: nfs-proxmox
          image: itsthenetwork/nfs-server-alpine:latest
          securityContext:
            privileged: true
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpc-tcp
              containerPort: 111
              protocol: TCP
            - name: rpc-udp
              containerPort: 111
              protocol: UDP
          env:
            - name: SHARED_DIRECTORY
              value: /shared
          volumeMounts:
            - name: data
              mountPath: /shared
          startupProbe:
            tcpSocket:
              port: nfs
          livenessProbe:
            tcpSocket:
              port: nfs
          readinessProbe:
            tcpSocket:
              port: nfs
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
      volumes:
        - name: data
          hostPath:
            path: /var/mnt/nfs-proxmox
      nodeSelector:
        kubernetes.io/hostname: winston
