---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-proxmox
  labels:
    app: nfs-proxmox
  annotations:
    configmap.reloader.stakater.com/reload: config
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: nfs-proxmox
  template:
    metadata:
      labels:
        app: nfs-proxmox
        policy.gatekeeper.sh/ignore: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nfs-proxmox
          # image: erichough/nfs-server:latest
          image: itsthenetwork/nfs-server-alpine:latest
          securityContext:
            privileged: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SHARED_DIRECTORY
              value: /mnt/shared
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          volumeMounts:
            - name: backups
              mountPath: /mnt/shared/backups
            - name: content
              mountPath: /mnt/shared/content
            - name: config
              mountPath: /etc/exports
              subPath: exports
            # - name: nfsdcld
            #   mountPath: /var/lib/nfs/nfsdcld
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "nfsdcld --foreground"]
          startupProbe:
            tcpSocket:
              port: nfs
          livenessProbe:
            tcpSocket:
              port: nfs
          readinessProbe:
            tcpSocket:
              port: nfs
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 10m
              memory: 512Mi
      volumes:
        - name: backups
          hostPath:
            path: /var/mnt/nfs-proxmox-backups
        - name: content
          hostPath:
            path: /var/mnt/nfs-proxmox-content
        - name: config
          configMap:
            name: config
            defaultMode: 0644
        # - name: nfsdcld
        #   emptyDir:
        #     medium: Memory
      nodeSelector:
        kubernetes.io/hostname: winston
