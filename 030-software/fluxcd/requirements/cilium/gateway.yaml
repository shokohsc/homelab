    #           app: syslog

    - name: postgres
      port: 5432
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg

