---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  annotations:
    dashboard.${domain}/icon: bee
    dashboard.${domain}/name: hubble
    dashboard.${domain}/url: https://hubble.${domain}
spec:
  hostnames:
  - hubble.${domain}
  parentRefs:
  - name: cilium
  rules:
  - backendRefs:
    - name: hubble-ui
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: cilium
spec:
  parentRefs:
    - name: cilium
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: response-headers
  namespace: cilium
spec:
  parentRefs:
    - name: cilium
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
            - name: X-XSS-Protection
              value: "1; mode=block"
            - name: X-Frame-Options
              value: "SAMEORIGIN"
            - name: X-Content-Type-Options
              value: "nosniff"
            - name: Strict-Transport-Security
              value: "max-age=31536000; includeSubDomains; preload"
            - name: Content-Security-Policy
              value: "upgrade-insecure-requests"