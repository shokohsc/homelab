---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  annotations:
    dashboard.${domain}/icon: bee
    dashboard.${domain}/name: hubble
    dashboard.${domain}/url: https://hubble.${domain}
spec:
  hostnames:
  - hubble.${domain}
  parentRefs:
  - name: cilium
  rules:
  - backendRefs:
    - name: hubble-ui
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /