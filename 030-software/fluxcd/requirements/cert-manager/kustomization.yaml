apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                    - key: topology.kubernetes.io/region
                      operator: In
                      values:
                      - metal
            tolerations:
              - effect: NoSchedule
                key: node.kubernetes.io/nuc
                operator: Exists
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/instance=cert-manager
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            containers:
              - name: cert-manager
                securityContext:
                  readOnlyRootFilesystem: true
                resources:
                  limits:
                    cpu: 100m
                    memory: 128Mi
    target:
      kind: Deployment
      labelSelector: app=cert-manager
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-cainjector
                securityContext:
                  readOnlyRootFilesystem: true
                resources:
                  limits:
                    cpu: 100m
                    memory: 128Mi
    target:
      kind: Deployment
      labelSelector: app=cainjector
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-webhook
                securityContext:
                  readOnlyRootFilesystem: true
                resources:
                  limits:
                    cpu: 100m
                    memory: 128Mi
    target:
      kind: Deployment
      labelSelector: app=webhook
