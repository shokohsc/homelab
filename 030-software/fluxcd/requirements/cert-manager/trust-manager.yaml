---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
spec:
  interval: ${interval}
  url: oci://quay.io/jetstack/charts/trust-manager
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^0.22.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  interval: ${interval}
  chartRef:
    kind: OCIRepository
    name: trust-manager
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                revisionHistoryLimit: 0
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/instance=trust-manager
  values:
    resources:
      limits:
        memory: 128Mi
    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"

    defaultPackage:
      resources:
        limits:
          memory: 128Mi

    secretTargets:
      enabled: true
      authorizedSecretsAll: true
