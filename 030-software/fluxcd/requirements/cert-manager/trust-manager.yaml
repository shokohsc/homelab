---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
spec:
  interval: ${interval}
  url: oci://quay.io/jetstack/charts/trust-manager
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^0.22.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  interval: ${interval}
  chartRef:
    kind: OCIRepository
    name: trust-manager
  values:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"

    defaultPackage:
      resources:
        limits:
          cpu: 100m
          memory: 128Mi

    secretTargets:
      enabled: true
      authorizedSecretsAll: true
