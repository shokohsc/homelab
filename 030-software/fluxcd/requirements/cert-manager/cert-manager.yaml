---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
spec:
  interval: ${interval}
  url: oci://quay.io/jetstack/charts/cert-manager
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^v1.20.2"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: ${interval}
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: cert-manager
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                revisionHistoryLimit: 0
            target:
              kind: Deployment
              labelSelector: app.kubernetes.io/instance=cert-manager
  values:
    crds:
      enabled: true

    config:
      gatewayAPI:
        enabled: true
        enableListenerSet: true
      featureGates:
        ListenerSets: true

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi

    webhook:
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 512Mi
      tolerations:
        - key: "node.kubernetes.io/nuc"
          operator: "Exists"
          effect: "NoSchedule"

    cainjector:
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 512Mi
      tolerations:
        - key: "node.kubernetes.io/nuc"
          operator: "Exists"
          effect: "NoSchedule"

    startupapicheck:
      tolerations:
        - key: "node.kubernetes.io/nuc"
          operator: "Exists"
          effect: "NoSchedule"

    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"
