---
# `namespace:` is deliberately not set: this component deploys into two
# namespaces (`mountpoint-s3-csi` for the driver, `mount-s3` for the generated
# Mountpoint Pods) and kustomize's namespace transformer would rename the
# `mount-s3` Namespace object to `mountpoint-s3-csi`. Every resource therefore
# carries its own explicit `metadata.namespace`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - priorityclass.yaml
  - crd.yaml
  - csidriver.yaml
  - rbac.yaml
  - controller.yaml
  - node.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 1
                    preference:
                      matchExpressions:
                        - key: topology.kubernetes.io/region
                          operator: In
                          values:
                            - homelab
            tolerations:
              - key: "node.kubernetes.io/nuc"
                operator: "Exists"
                effect: "NoSchedule"
    target:
      kind: Deployment
      labelSelector: app=s3-csi-controller
