apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: talos-proxmox-autoscaler
resources:
  - namespace.yaml
  - provider-config.yaml
  - proxmoxidentity.yaml
  - deployment.yaml
  - configmap.yaml
  - rbac.yaml
  - secret.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
      spec:
        template:
          spec:
            nodeSelector: null
            containers:
              - name: talos-proxmox-autoscaler
                volumeMounts:
                  - mountPath: /etc/ssl/certs/ca-certs.pem
                    subPath: ca-certs.pem
                    name: tls
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 1
                    preference:
                      matchExpressions:
                        - key: topology.kubernetes.io/zone
                          operator: In
                          values:
                            - metal
            volumes:
              - name: tls
                configMap:
                  name: homelab-ca
                  defaultMode: 0644
            tolerations:
              - effect: NoSchedule
                key: node.kubernetes.io/nuc
                operator: Exists
    target:
      kind: Deployment
      labelSelector: app=talos-proxmox-autoscaler
