apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaler-config
data:
  cluster_name: "talos"
  autoscaler_tag: "talos"
  min_workers: "0"
  max_workers: "5"
  min_cpu: "2"
  max_cpu: "8"
  min_memory_gib: "4"
  max_memory_gib: "16"
  disk_gib: "50"
  storage_pool: "local-lvm"
  network_bridge: "vmbr1"
  proxmox_api_url: "https://proxmox.${domain}"
  proxmox_insecure: "false"
  base_vmid: "8000"
  base_gpu_vmid: "9000"
  tags: "autoscaler,worker"
  mac_address: ""
  serial: "worker-vm"
  vlan_id: "20"
  worker_prefix: "worker-vm"
  gpu_prefix: "worker-vm-gpu"
  worker_gpu_nodes: |
    [
        {
            "type": "tesla-p4",
            "nodes": [
                "genji",
                "hanzo"
            ],
            "pci_devices": [
                {
                    "id": "0000:0c:00.0",
                    "pcie": true,
                    "gpu": true
                }
            ]
        },
        {
            "type": "tesla-p40",
            "nodes": [
                "roadhog"
            ],
            "pci_devices": [
                {
                    "id": "0000:83:00.0",
                    "pcie": true,
                    "gpu": true
                }
            ]
        }
    ]