---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stackgres
spec:
  interval: ${interval}
  url: https://stackgres.io/downloads/stackgres-k8s/stackgres/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stackgres
spec:
  interval: ${interval}
  chart:
    spec:
      chart: stackgres-operator
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: stackgres
      interval: ${interval}
