---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pixie-operator
spec:
  interval: ${interval}
  url: https://pixie-operator-charts.storage.googleapis.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pixie-operator
spec:
  interval: ${interval}
  chart:
    spec:
      chart: pixie-operator-chart
      version: 0.1.7
      sourceRef:
        kind: HelmRepository
        name: pixie-operator
      interval: ${interval}
  values:
    deployOLM: "false"
    olmNamespace: "olm"
    olmOperatorNamespace: "px-operator"
    olmBundleChannel: "stable"
    name: "pixie"
    clusterName: "homelab"
    version: ""
    deployKey: ""
    customDeployKeySecret: ""
    disableAutoUpdate: false
    useEtcdOperator: false
    cloudAddr: "withpixie.ai:443"
    dataAccess: "Full"
    pod:
      annotations: {}
      labels: {}
      resources: {}
      nodeSelector: {}
      tolerations: []
    patches: {}
