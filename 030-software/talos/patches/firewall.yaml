apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubelet-ingress
portSelector:
  ports:
    - 10250
  protocol: tcp
ingress:
  - subnet: $TALOS_SUBNET.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-ingress
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
{{- range $subnet := .ClusterConfig.ClusterNetwork.ServiceSubnet }}
  - subnet: {{ $subnet }}
  - subnet: ${TALOS_SUBNET}.0/24
  - subnet: ${MGMT_SUBNET}.0/24
{{- end -}}
{{- if ne .MachineConfig.MachineType "worker" }}
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: trustd-ingress
portSelector:
  ports:
    - 50001
  protocol: tcp
ingress:
  - subnet: $TALOS_SUBNET.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubernetes-api-ingress
portSelector:
  ports:
    - 6443
  protocol: tcp
ingress:
  - subnet: 0.0.0.0/0
  # - subnet: ::/0
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd-ingress
portSelector:
  ports:
    - 2379-2380
  protocol: tcp
ingress:
  - subnet: $TALOS_SUBNET.10/32
  - subnet: $TALOS_SUBNET.20/32
  - subnet: $TALOS_SUBNET.30/32
{{- end }}
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cni-vxlan
portSelector:
  ports:
    - 8472
  protocol: udp
ingress:
  - subnet: $TALOS_SUBNET.0/24