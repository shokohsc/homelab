# Do NOT enable bpf.masquerade with KubeSpan
operator:
  replicas: 1

ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

gatewayAPI:
  enabled: true
  externalTrafficPolicy: Local
  enableAlpn: true
  enableAppProtocol: true

hubble:
  enabled: true
  relay:
    enabled: true
    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"
  ui:
    enabled: true
    tolerations:
      - key: "node.kubernetes.io/nuc"
        operator: "Exists"
        effect: "NoSchedule"

bgpControlPlane:
  enabled: true

loadBalancer:
  l7:
    backend: envoy
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16
enableIPv4Masquerade: true

bpf:
  masquerade:  true
  lbModeAnnotation: true
  hostLegacyRouting: true
  disableExternalIPMitigation: true
  tproxy: true
  lbExternalClusterIP: true
bandwidthManager:
  enabled: true
  bbr: true
  bbrHostNamespaceOnly: true
